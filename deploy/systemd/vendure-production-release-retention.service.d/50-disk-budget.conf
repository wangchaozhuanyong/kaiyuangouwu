[Unit]
Description=Bound Vendure release outputs and verified local file backups

[Service]
# Keep the disk policy independent of an older application release reinstalling
# the base unit. The helpers retain current pointers and verify offsite backups.
User=root
Group=root
Environment=HOME=/root
Environment=VENDURE_FILE_BACKUP_RETENTION_DAYS=5
# Read the existing PM2 daemon as ubuntu while keeping NoNewPrivileges and the
# filesystem/kernel protections inherited from the base service.
AmbientCapabilities=CAP_SETUID CAP_SETGID
ExecStart=
ExecStart=/usr/local/sbin/vendure-production-disk-maintenance --apply
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=-/var/www/kaiyuangouwu-frontend-releases -/var/www/kaiyuangouwu-storefront-releases /var/backups/vendure-files
