[Service]
# The count policy survives application releases that reinstall an older shell
# entry point. Three complete local recovery sets remain protected.
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/sbin/vendure-file-backup-retention.py --apply --keep-count 3
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
