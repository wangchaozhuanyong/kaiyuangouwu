upstream vendure_backend {
    server 127.0.0.1:3002;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=vendure_shop_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vendure_admin_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://damatong.net$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name damatong.net www.damatong.net console.damatong.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    return 301 https://damatong.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.damatong.net;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    return 301 https://damatong.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name damatong.net;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    root /var/www/kaiyuangouwu-current/packages/storefront/dist;
    index index.html;
    client_max_body_size 60m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

    location = /promo {
        limit_req zone=vendure_shop_api burst=40 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /promo/enter {
        limit_req zone=vendure_shop_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /promo/account-entry {
        limit_req zone=vendure_shop_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /robots.txt {
        proxy_pass http://vendure_backend/promo/robots;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location = /_storefront_promotion_gate {
        internal;
        proxy_pass http://vendure_backend/promo/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include proxy_params;
        proxy_http_version 1.1;
    }

    location @storefront_promotion_entry {
        return 302 /promo;
    }

    location = /shop-api {
        limit_req zone=vendure_shop_api burst=40 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location ^~ /digital-delivery/ {
        limit_req zone=vendure_shop_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /dashboard {
        return 302 https://console.damatong.net/dashboard/;
    }

    location ^~ /dashboard/ {
        return 302 https://console.damatong.net$request_uri;
    }

    location = /admin-api {
        return 404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
        try_files $uri @vendure_assets;
    }

    location @vendure_assets {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        auth_request /_storefront_promotion_gate;
        error_page 401 403 = @storefront_promotion_entry;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location ~* \.(env|pem|key|crt|pfx|p12|sql|sqlite|db|log|bak|zip|tar|gz|7z|rar)$ {
        return 404;
    }

    location / {
        auth_request /_storefront_promotion_gate;
        error_page 401 403 = @storefront_promotion_entry;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/damatong-storefront-access.log;
    error_log /var/log/nginx/damatong-storefront-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.damatong.net;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    client_max_body_size 60m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

    location = / {
        return 302 /dashboard/;
    }

    location = /dashboard {
        return 302 /dashboard/;
    }

    location ^~ /dashboard/ {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /admin-api {
        limit_req zone=vendure_admin_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/damatong-console-access.log;
    error_log /var/log/nginx/damatong-console-error.log;
}
