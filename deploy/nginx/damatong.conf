upstream vendure_backend {
    server 127.0.0.1:3002;
    keepalive 16;
}

server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

log_format vendure_realtime escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"status":$status,"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
    '"connection":$connection,"connection_requests":$connection_requests,'
    '"limit_conn_status":"$limit_conn_status","limit_req_status":"$limit_req_status",'
    '"cf_ray":"$http_cf_ray"}';

# Only trust Cloudflare's published proxy networks when restoring the visitor IP.
# Keep this list synchronized with https://www.cloudflare.com/ips/.
# Loopback is trusted only so the on-host origin-full verifier can use isolated
# documentation-range visitor IPs; realip_remote_addr remains the loopback peer.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from ::1/128;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# realip_remote_addr retains the TCP peer after remote_addr becomes the visitor IP.
geo $realip_remote_addr $trusted_cloudflare_origin {
    default 0;
    127.0.0.0/8 1;
    ::1/128 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

limit_req_zone $binary_remote_addr zone=vendure_shop_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vendure_admin_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=vendure_realtime_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

map $host $storefront_canonical_host {
    default moyaoai.com;
    www.damatong.net damatong.net;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        # Preserve verified Cloudflare for SaaS hostnames during HTTP-to-HTTPS redirects.
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name moyaoai.com www.moyaoai.com console.moyaoai.com damatong.net www.damatong.net console.damatong.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.moyaoai.com www.damatong.net;

    ssl_certificate /etc/letsencrypt/live/moyaoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyaoai.com/privkey.pem;

    if ($trusted_cloudflare_origin = 0) { return 444; }

    return 301 https://$storefront_canonical_host$request_uri;
}

server {
    # Cloudflare for SaaS connects with the configured fallback-origin SNI while
    # preserving the merchant hostname in Host. Making the storefront the HTTPS
    # default lets verified custom hostnames use the same static client and API;
    # the Shop API middleware still rejects every unregistered or pending host.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name moyaoai.com damatong.net _;

    ssl_certificate /etc/letsencrypt/live/moyaoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyaoai.com/privkey.pem;

    if ($trusted_cloudflare_origin = 0) { return 444; }

    root /var/www/kaiyuangouwu-current/packages/storefront/dist;
    index index.html;
    client_max_body_size 60m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;

    location = /promo {
        # The backend emits a promotion-specific CSP containing the exact SHA-256
        # of its trusted inline renderer. Declaring these headers locally prevents
        # Nginx from inheriting the server-level CSP and blocking that renderer.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        limit_req zone=vendure_shop_api burst=40 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /promo/enter {
        limit_req zone=vendure_shop_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /promo/account-entry {
        limit_req zone=vendure_shop_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    location = /robots.txt {
        proxy_pass http://vendure_backend/promo/robots;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location = /sitemap.xml {
        proxy_pass http://vendure_backend/promo/sitemap;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location = /shop-api {
        limit_req zone=vendure_shop_api burst=40 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /storefront-realtime/events {
        limit_req zone=vendure_shop_api burst=10 nodelay;
        limit_conn vendure_realtime_per_ip 12;
        access_log /var/log/nginx/awanmesh-storefront-realtime.log vendure_realtime;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_ignore_client_abort off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location ^~ /digital-delivery/ {
        limit_req zone=vendure_shop_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /image-generation/private/ {
        limit_req zone=vendure_shop_api burst=40 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /dashboard {
        return 302 https://console.moyaoai.com/dashboard/;
    }

    location ^~ /dashboard/ {
        return 302 https://console.moyaoai.com$request_uri;
    }

    location = /admin-api {
        return 404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        try_files $uri @vendure_assets;
    }

    # Legacy public storefront artwork is not content-hashed. Cache it briefly while
    # Vite-generated /assets files above remain safely immutable for one year.
    location ^~ /storefront/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location @vendure_assets {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /legacy-browser-guard.js {
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location = /unsupported-browser.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'none'; style-src 'unsafe-inline'; script-src 'none'" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location ~* \.(env|pem|key|crt|pfx|p12|sql|sqlite|db|log|bak|zip|tar|gz|7z|rar)$ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/awanmesh-storefront-access.log;
    error_log /var/log/nginx/awanmesh-storefront-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.damatong.net;

    ssl_certificate /etc/letsencrypt/live/moyaoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyaoai.com/privkey.pem;

    if ($trusted_cloudflare_origin = 0) { return 444; }

    return 301 https://console.moyaoai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.moyaoai.com;

    ssl_certificate /etc/letsencrypt/live/moyaoai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moyaoai.com/privkey.pem;

    if ($trusted_cloudflare_origin = 0) { return 444; }

    client_max_body_size 60m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; upgrade-insecure-requests" always;

    location = / {
        return 302 /dashboard/;
    }

    location = /dashboard {
        return 302 /dashboard/;
    }

    location ^~ /dashboard/ {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location = /admin-api {
        limit_req zone=vendure_admin_api burst=20 nodelay;
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/awanmesh-console-access.log;
    error_log /var/log/nginx/awanmesh-console-error.log;
}
