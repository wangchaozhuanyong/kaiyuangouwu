upstream vendure_backend {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://damatong.net$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name damatong.net www.damatong.net console.damatong.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    return 301 https://damatong.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.damatong.net;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    return 301 https://damatong.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name damatong.net;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    root /var/www/kaiyuangouwu/packages/storefront/dist;
    index index.html;
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /shop-api {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
    }

    location = /dashboard {
        return 302 https://console.damatong.net/dashboard/;
    }

    location ^~ /dashboard/ {
        return 302 https://console.damatong.net$request_uri;
    }

    location = /admin-api {
        return 404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @vendure_assets;
    }

    location @vendure_assets {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location ~* \.(env|pem|key|crt|pfx|p12|sql|sqlite|db|log|bak|zip|tar|gz|7z|rar)$ {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/damatong-storefront-access.log;
    error_log /var/log/nginx/damatong-storefront-error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.damatong.net;

    ssl_certificate /etc/letsencrypt/live/damatong.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/damatong.net/privkey.pem;

    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 302 /dashboard/;
    }

    location = /dashboard {
        return 302 /dashboard/;
    }

    location ^~ /dashboard/ {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location = /admin-api {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
        proxy_pass http://vendure_backend;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* (^|/)\. {
        return 404;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/damatong-console-access.log;
    error_log /var/log/nginx/damatong-console-error.log;
}
