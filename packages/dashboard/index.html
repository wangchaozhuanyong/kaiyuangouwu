<!doctype html>
<html lang="zh-Hans">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="面向中国大陆与马来西亚市场的电商运营管理后台" />
        <meta name="author" content="Vendure" />
        <script>
            (() => {
                let theme = 'system';
                try {
                    const settings = JSON.parse(localStorage.getItem('vendure-user-settings') || '{}');
                    theme = settings.theme || theme;
                } catch {
                    // Invalid or unavailable local settings fall back to the system theme.
                }
                const resolvedTheme =
                    theme === 'dark' || theme === 'light'
                        ? theme
                        : window.matchMedia('(prefers-color-scheme: dark)').matches
                          ? 'dark'
                          : 'light';
                document.documentElement.classList.add(resolvedTheme);
            })();
        </script>
        <style>
            html,
            body,
            #app {
                min-height: 100%;
                background: oklch(0.97 0.005 231);
            }

            html.dark,
            html.dark body,
            html.dark #app {
                background: oklch(0.15 0.01 231);
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/app/main.jsx"></script>
    </body>
</html>
