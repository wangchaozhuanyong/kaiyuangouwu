<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <!-- 主渐变：明亮极速青蓝至科技深蓝 -->
    <linearGradient id="yqMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="30%" stop-color="#00BAFF" />
      <stop offset="70%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    
    <!-- 节点发光微投影 -->
    <filter id="yqGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00BAFF" flood-opacity="0.3" />
    </filter>

    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
  </defs>

  <g filter="url(#yqGlow)">
    <!-- 左侧 AI 神经网络 / 云桥数据总线连接器与发光端点 -->
    <circle cx="12" cy="38" r="3.5" fill="#00F0FF" />
    <path d="M12 38 H28 L46 54" stroke="url(#circuitGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="8" cy="54" r="3.5" fill="#00E5FF" />
    <path d="M8 54 H32 L46 58" stroke="url(#circuitGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="8" cy="70" r="3.5" fill="#00BAFF" />
    <path d="M8 70 H32 L46 66" stroke="url(#circuitGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="12" cy="86" r="3.5" fill="#0088FF" />
    <path d="M12 86 H28 L46 70" stroke="url(#circuitGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 字母 Y：锋芒科技几何线条 -->
    <path d="M46 22 H60 L75 58 L90 22 H104 L83 68 V100 H67 V68 L46 22 Z" fill="url(#yqMainGrad)" />

    <!-- 字母 Q：极具辨识度的科技圆环与贯穿尾翼 -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M116 22 C137.539 22 155 39.461 155 61 C155 70.364 151.697 78.956 146.185 85.645 L155.8 95.26 C158.534 97.994 158.534 102.426 155.8 105.16 C153.066 107.894 148.634 107.894 145.9 105.16 L135.82 95.08 C129.894 98.22 123.149 100 116 100 C94.461 100 77 82.539 77 61 C77 39.461 94.461 22 116 22 Z M116 38 C103.297 38 93 48.297 93 61 C93 73.703 103.297 84 116 84 C128.703 84 139 73.703 139 61 C139 48.297 128.703 38 116 38 Z" fill="url(#yqMainGrad)" />
  </g>
</svg>
