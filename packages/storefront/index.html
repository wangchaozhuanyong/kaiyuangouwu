<!doctype html>
<html lang="zh-CN" translate="yes" data-storefront-theme-pending>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="renderer" content="webkit" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta name="theme-color" content="#f1f5f9" />
        <meta name="description" content="浏览店铺商品与服务，管理账户与订单。" />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta name="application-name" content="店铺" />
        <!-- Host-resolved icons are the only parser-time declarations. Safari may
             retain the first icon it sees and ignore later JavaScript changes.
             The fragment itself supplies a neutral icon for unconfigured stores. -->
        <!--# include virtual="/_storefront/lcp-preload" -->
        <style>
            html,
            body {
                margin: 0;
                background-color: var(--bg, #f1f5f9);
            }
            #storefront-boot-loading {
                position: fixed;
                inset: 0;
                visibility: hidden;
            }
            #root:empty + #storefront-boot-loading:not([aria-hidden='true']),
            html[data-storefront-boot-pending] #storefront-boot-loading {
                visibility: visible;
            }
        </style>
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="店铺" />
        <meta property="og:title" content="在线商城" />
        <meta property="og:description" content="浏览店铺商品与服务，管理账户与订单。" />
        <meta property="og:url" content="/" />
        <meta property="og:image" content="/storefront/neutral-social.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="店铺商品与服务" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="在线商城" />
        <meta name="twitter:description" content="浏览店铺商品与服务，管理账户与订单。" />
        <meta name="twitter:image" content="/storefront/neutral-social.png" />
        <meta name="twitter:image:alt" content="店铺商品与服务" />
        <title>在线商城</title>
        <script id="storefront-document-continuity">
            (function () {
                try {
                    var choice = /(?:^|;\s*)storefront_analytics_consent=(granted|denied)(?:;|$)/.test(
                        document.cookie,
                    );
                    var stored = localStorage.getItem('storefront-analytics-opt-out:v1');
                    if (choice || stored === '0' || stored === '1')
                        document.documentElement.setAttribute('data-storefront-traffic-choice', '');
                } catch (e) {}
                if (
                    new URLSearchParams(location.search).get('storefrontPreviewEmbedded') === '1' ||
                    !/\/category\/?$/.test(location.pathname)
                )
                    return;
                try {
                    var key = history.state && history.state.__TSR_key;
                    var cache = JSON.parse(sessionStorage.getItem('tsr-scroll-restoration-v1_3') || '{}');
                    var entries = cache[key];
                    var selector = '[data-scroll-restoration-id="category-results"]';
                    var entry = entries && entries[selector];
                    if (!entry || !Number.isFinite(entry.scrollY) || entry.scrollY <= 0) return;
                    var done = false;
                    // Parsing can expose a partial list before enough rows exist to restore.
                    // Reserve only trailing scroll extent; existing card geometry stays native.
                    var reserve = document.createElement('style');
                    reserve.textContent =
                        selector +
                        '::after{content:"";display:block;height:calc(' +
                        Math.ceil(entry.scrollY) +
                        'px + 100vh)}';
                    document.head.appendChild(reserve);
                    function stop() {
                        done = true;
                        observer.disconnect();
                        document.removeEventListener('load', restore, true);
                        if (reserve) {
                            reserve.remove();
                            reserve = null;
                        }
                    }
                    function restore() {
                        if (done) return;
                        var element = document.querySelector(selector);
                        if (element) {
                            element.scrollTop = entry.scrollY;
                            var last = element.lastElementChild;
                            if (
                                reserve &&
                                last &&
                                last.getBoundingClientRect().bottom -
                                    element.getBoundingClientRect().top +
                                    element.scrollTop +
                                    (parseFloat(getComputedStyle(element).paddingBottom) || 0) >=
                                    entry.scrollY + element.clientHeight
                            ) {
                                reserve.remove();
                                reserve = null;
                            }
                        }
                        if (!reserve && document.documentElement.hasAttribute('data-storefront-app-owned'))
                            stop();
                    }
                    var observer = new MutationObserver(restore);
                    observer.observe(document.documentElement, {
                        childList: true,
                        subtree: true,
                        attributes: true,
                        attributeFilter: ['data-storefront-app-owned'],
                    });
                    document.addEventListener('load', restore, true);
                    document.addEventListener('storefront:page-error', stop, { once: true });
                    window.addEventListener('pagehide', stop, { once: true });
                    document.addEventListener(
                        'storefront:app-owned',
                        function () {
                            restore();
                        },
                        { once: true },
                    );
                    ['pointerdown', 'wheel', 'touchstart', 'keydown'].forEach(function (type) {
                        document.addEventListener(type, stop, { once: true, passive: true });
                    });
                    restore();
                } catch (e) {}
            })();
        </script>
        <script defer src="/storefront/document-loading.js?v=soft-entry-20261028"></script>
        <!-- Public HTML already carries its verified theme. Unknown stores stay neutral
             until configuration arrives; a cached theme must not delay document parsing. -->
        <script nomodule src="/legacy-browser-guard.js"></script>
    </head>
    <body>
        <div id="root"></div>
        <main
            id="storefront-boot-loading"
            class="page-skeleton page-skeleton--route page-skeleton--viewport"
            role="status"
            aria-label="正在加载页面"
            aria-busy="true"
        >
            <span class="brand-loading" aria-hidden="true">
                <span class="route-transition-mark"></span>
                <strong class="brand-loading-name"></strong>
                <span class="brand-loading-subtitle"></span>
                <span class="brand-loading-caption">
                    <span class="brand-loading-label">正在连接</span>
                    <span class="brand-loading-bar"><i></i></span>
                </span>
            </span>
        </main>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
