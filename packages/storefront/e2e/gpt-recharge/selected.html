<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GPT自助充值 · 方案二定稿</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #e9edf1;
                color: #25292d;
                font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            }
            .board {
                width: 1600px;
                height: 1000px;
                padding: 36px 40px 24px;
            }
            header {
                height: 108px;
                display: flex;
                justify-content: space-between;
                align-items: start;
            }
            header small,
            p,
            label,
            footer {
                color: #626b75;
            }
            h1 {
                font-size: 28px;
                line-height: 36px;
                margin: 4px 0;
            }
            p {
                font-size: 14px;
                margin: 4px 0;
            }
            .views {
                display: flex;
                justify-content: space-between;
                gap: 32px;
            }
            .views label {
                display: block;
                font-size: 12px;
                margin: 0 0 12px 2px;
            }
            .frame {
                overflow: hidden;
                border: 1px solid #d9dfe5;
                border-radius: 16px;
                background: #f1f5f9;
            }
            .desktop .frame {
                width: 1110px;
                height: 694px;
            }
            .mobile .frame {
                width: 351px;
                height: 760px;
                border-radius: 22px;
            }
            iframe {
                border: 0;
                display: block;
                transform-origin: top left;
            }
            .desktop iframe {
                width: 1440px;
                height: 900px;
                transform: scale(0.7708333333);
            }
            .mobile iframe {
                width: 390px;
                height: 844px;
                transform: scale(0.9);
            }
            footer {
                text-align: center;
                font-size: 12px;
                margin-top: 28px;
            }
            header a {
                color: #25292d;
                font-size: 14px;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <div class="board">
            <header>
                <div>
                    <small>已选方案二</small>
                    <h1>紧凑表单</h1>
                    <p>电脑左右分区 · 手机单列填写 · 复用商城语言菜单</p>
                </div>
                <a href="./?presentation=1">打开可点击页面 ↗</a>
            </header>
            <div class="views">
                <section class="desktop">
                    <label>电脑端 · 1440px</label>
                    <div class="frame"><iframe title="电脑端" src="./?presentation=1"></iframe></div>
                </section>
                <section class="mobile">
                    <label>手机端 · 390px</label>
                    <div class="frame"><iframe title="手机端" src="./?presentation=1"></iframe></div>
                </section>
            </div>
            <footer>真实页面组件 · 演示数据 · Pro500 暂未开放 · 尚未上线</footer>
        </div>
    </body>
</html>
