name: Deploy Affected Frontends
on:
    workflow_call:
        inputs:
            target_sha:
                required: true
                type: string
            base_sha:
                required: true
                type: string
            components:
                required: true
                type: string
            ci_run_id:
                required: true
                type: string
permissions:
    contents: read
    actions: read
    id-token: write
jobs:
    deploy:
        name: reuse and atomically deploy affected frontends
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            BASE_SHA: ${{ inputs.base_sha }}
            COMPONENTS: ${{ inputs.components }}
            CI_RUN_ID: ${{ inputs.ci_run_id }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha }}
                  fetch-depth: 0
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: '24.19.0'
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
              with:
                  bun-version: '1.3.14'
            - name: Verify source, scope and successful checks
              run: |
                  [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
                  git diff --no-renames --name-only -z "$BASE_SHA" "$TARGET_SHA" -- | node deploy/frontend-release.mjs scope "$COMPONENTS"
                  node scripts/release-evidence.mjs verify "$BASE_SHA" "$TARGET_SHA" "$CI_RUN_ID"
            - name: Reuse checked frontend artifacts or build only missing artifacts
              env:
                  NODE_ENV: production
              run: |
                  mkdir -p "$RUNNER_TEMP/frontend-payload"
                  installed=false
                  IFS=',' read -r -a apps <<< "$COMPONENTS"
                  for app in "${apps[@]}"; do
                      node deploy/frontend-artifact.mjs restore "$app" "$RUNNER_TEMP/frontend-input-$app" "$CI_RUN_ID" > "$RUNNER_TEMP/restore-$app.txt"
                      if ! grep -qx 'restored=true' "$RUNNER_TEMP/restore-$app.txt"; then
                          if [[ "$installed" == false ]]; then
                              bun install --frozen-lockfile --linker=hoisted
                              installed=true
                          fi
                          bun run --cwd "packages/$app" build
                      fi
                      cp -R "packages/$app/dist" "$RUNNER_TEMP/frontend-payload/$app"
                  done
            - name: Package the fixed frontend release
              id: archive
              run: |
                  name="frontends-${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
                  tar -czf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/frontend-payload" .
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  echo "sha256=$(sha256sum "$RUNNER_TEMP/$name" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
            - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
              with:
                  role-to-assume: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
                  aws-region: ap-northeast-1
                  role-session-name: vendure-frontend-${{ github.run_id }}
            - name: Store immutable frontend artifact
              env:
                  ARCHIVE: ${{ steps.archive.outputs.name }}
              run: aws s3 cp "$RUNNER_TEMP/$ARCHIVE" "s3://yunqiao-vendure-prod-backup-079740175286-apne1/deployments/$TARGET_SHA/$ARCHIVE" --only-show-errors
            - name: Deploy and verify the affected public apps
              env:
                  ARCHIVE: ${{ steps.archive.outputs.name }}
                  ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
              run: node deploy/frontend-ssm.mjs
