name: Production Runtime Artifact

on:
    push:
        branches:
            - main
        paths:
            - 'packages/image-generation-plugin/skill/image-prompt-pro/**'
            - 'packages/image-generation-plugin/src/prompt/prompt-rules.bundle.json'
            - 'packages/image-generation-plugin/src/prompt/prompt-rules.bundle.ts'
    workflow_dispatch:
        inputs:
            target_sha:
                description: 'Full 40-character SHA currently at origin/main'
                required: true
                type: string
            media_keys:
                description: 'Optional reviewed comma-separated storefront media manifest keys'
                required: false
                default: ''
                type: string
            channel_codes:
                description: 'Required reviewed Channel codes when any managed publisher is selected'
                required: false
                default: ''
                type: string
            auth_visuals:
                description: 'Publish the reviewed auth visual manifest through Admin API'
                required: false
                default: false
                type: boolean

permissions:
    actions: read
    contents: read

concurrency:
    group: production-runtime-${{ inputs.target_sha || github.sha }}
    cancel-in-progress: false

env:
    CI: true
    MEDIA_CHANNEL_CODES: ${{ inputs.channel_codes || '' }}
    MEDIA_KEYS: ${{ inputs.media_keys || '' }}
    AUTH_VISUALS: ${{ inputs.auth_visuals && 'true' || 'false' }}
    NODE_OPTIONS: --max-old-space-size=8192

jobs:
    build:
        name: build verified linux/x64 runtime
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        steps:
            - name: Validate target input
              env:
                  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "target_sha must be a lowercase 40-character Git SHA" >&2
                    exit 1
                  fi
                  if [[ -n "$MEDIA_KEYS" ]] && [[ ! "$MEDIA_KEYS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]]; then
                    echo "media_keys must be a comma-separated list of manifest keys" >&2
                    exit 1
                  fi
                  if [[ -n "$MEDIA_CHANNEL_CODES" ]] && [[ ! "$MEDIA_CHANNEL_CODES" =~ ^[a-z0-9_][a-z0-9_-]*(,[a-z0-9_][a-z0-9_-]*)*$ ]]; then
                    echo "channel_codes must be a comma-separated list of Channel codes" >&2
                    exit 1
                  fi
                  if [[ "$AUTH_VISUALS" != "true" && "$AUTH_VISUALS" != "false" ]]; then
                    echo "auth_visuals must be true or false" >&2
                    exit 1
                  fi
                  if [[ ( -n "$MEDIA_KEYS" || "$AUTH_VISUALS" == "true" ) && -z "$MEDIA_CHANNEL_CODES" ]]; then
                    echo "channel_codes is required when a managed publisher is selected" >&2
                    exit 1
                  fi
                  if [[ -z "$MEDIA_KEYS" && "$AUTH_VISUALS" == "false" && -n "$MEDIA_CHANNEL_CODES" ]]; then
                    echo "channel_codes cannot be set without a managed publisher" >&2
                    exit 1
                  fi

            - name: Checkout target commit
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.sha }}
                  fetch-depth: 0

            - name: Enforce release source invariants
              env:
                  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  test "$(uname -m)" = "x86_64"
                  test "$(git rev-parse HEAD^{commit})" = "$TARGET_SHA"
                  test -z "$(git status --porcelain)"
                  git fetch origin main --no-tags --prune
                  test "$(git rev-parse refs/remotes/origin/main^{commit})" = "$TARGET_SHA"

            - name: Verify the exact release tree passed Build & Test
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  read -r -a release_commit < <(git rev-list --parents -n 1 "$TARGET_SHA")
                  if [[ "${#release_commit[@]}" -ne 3 ]]; then
                    echo 'Production releases require a reviewed two-parent main merge commit' >&2
                    exit 1
                  fi

                  RELEASE_BASE_SHA="${release_commit[1]}"
                  REVIEWED_HEAD_SHA="${release_commit[2]}"
                  git merge-base --is-ancestor "$RELEASE_BASE_SHA" "$REVIEWED_HEAD_SHA" || {
                    echo 'The reviewed PR head did not include the final main base' >&2
                    exit 1
                  }

                  TARGET_TREE="$(git rev-parse "$TARGET_SHA^{tree}")"
                  REVIEWED_TREE="$(git rev-parse "$REVIEWED_HEAD_SHA^{tree}")"
                  if [[ "$TARGET_TREE" != "$REVIEWED_TREE" ]]; then
                    echo 'The final main tree differs from the reviewed PR tree' >&2
                    exit 1
                  fi

                  CI_RUN_ID="$(gh api \
                    "/repos/${GITHUB_REPOSITORY}/actions/workflows/build_and_test.yml/runs?event=pull_request&status=success&head_sha=${REVIEWED_HEAD_SHA}&per_page=20" \
                    --jq '.workflow_runs[0].id // empty')"
                  if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
                    echo 'No successful Build & Test run exists for the reviewed PR head' >&2
                    exit 1
                  fi

                  echo "CI_RUN_ID=$CI_RUN_ID" >> "$GITHUB_ENV"
                  echo "REVIEWED_HEAD_SHA=$REVIEWED_HEAD_SHA" >> "$GITHUB_ENV"
                  echo "TARGET_TREE=$TARGET_TREE" >> "$GITHUB_ENV"

            - name: Restrict automatic releases to Skill-only changes
              if: github.event_name == 'push'
              env:
                  BASE_SHA: ${{ github.event.before }}
                  TARGET_SHA: ${{ github.sha }}
              run: |
                  if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
                    echo "Automatic Skill release requires a valid previous main SHA" >&2
                    exit 1
                  fi
                  git cat-file -e "$BASE_SHA^{commit}"
                  mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA")
                  test "${#changed_files[@]}" -gt 0
                  for changed_file in "${changed_files[@]}"; do
                    case "$changed_file" in
                      packages/image-generation-plugin/skill/image-prompt-pro/* | \
                      packages/image-generation-plugin/src/prompt/prompt-rules.bundle.json | \
                      packages/image-generation-plugin/src/prompt/prompt-rules.bundle.ts)
                        ;;
                      *)
                        echo "Automatic Skill release rejected non-Skill change: $changed_file" >&2
                        exit 1
                        ;;
                    esac
                  done

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '24.19.0'

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: '1.3.14'

            - name: Verify build toolchain
              run: |
                  test "$(node --version)" = "v24.19.0"
                  test "$(bun --version)" = "1.3.14"
                  test "$(node --print 'process.platform + "/" + process.arch')" = "linux/x64"

            - name: Install frozen dependencies
              run: bun install --frozen-lockfile --linker=hoisted

            - name: Audit monorepo dependencies
              run: |
                  BUN_AUDIT_REPORT="$RUNNER_TEMP/bun-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
                  node packages/dev-server/scripts/production-runtime-audit.mjs \
                    --audit-level high \
                    --evidence-output "$BUN_AUDIT_REPORT" \
                    --lockfile bun.lock
                  echo "BUN_AUDIT_REPORT=$BUN_AUDIT_REPORT" >> "$GITHUB_ENV"

            - name: Build production bundles
              env:
                  NODE_ENV: production
                  TZ: Asia/Shanghai
                  VENDURE_SERVE_GRAPHIQL: 'false'
                  VENDURE_DASHBOARD_URL: https://admin.build.test/dashboard
                  VENDURE_STOREFRONT_URL: https://store.build.test
                  VENDURE_EMAIL_FROM: Build Check <build@build.test>
                  VENDURE_IMPORT_ASSETS_DIR: /tmp/vendure-build-import
                  VENDURE_ASSET_UPLOAD_DIR: /tmp/vendure-build-assets
                  DIGITAL_DELIVERY_ROOT: /tmp/vendure-build-digital
                  DIGITAL_DELIVERY_SIGNING_SECRET: build-check-digital-secret-000000000000000000000000
                  IMAGE_GENERATION_STORAGE_ROOT: /tmp/vendure-build-images
                  IMAGE_GENERATION_DOWNLOAD_SECRET: build-check-image-download-key-000000000000000000000000
                  IMAGE_GENERATION_MASTER_KEY: build-check-image-master-key-000000000000000000000000
                  VENDURE_GOOGLE_TRANSLATION_API_KEY: build-check-google-translation-api-key
                  STORE_DOMAIN_CNAME_TARGET: stores.build.test
                  STORE_DOMAIN_ROUTING_MODE: require-domain
                  STORE_DOMAIN_BYPASS_HOSTS: ''
                  SMTP_USER: build-check
                  SMTP_PASSWORD: build-check-password
                  SMTP_HOST: smtp.build.test
                  SMTP_PORT: '587'
                  SMTP_SECURE: 'false'
                  SUPERADMIN_USERNAME: build-check-admin
                  SUPERADMIN_PASSWORD: build-check-admin-password
                  COOKIE_SECRET: build-check-cookie-secret-000000000000000000000000
                  TWO_FACTOR_DASHBOARD_ENCRYPTION_KEY: build-check-dashboard-2fa-key-000000000000000000000000
                  ORDER_CONFIRMATION_TOKEN_SECRET: build-check-order-token-secret-000000000000000000000000
                  USDT_PAYMENT_PROOF_SECRET: build-check-usdt-proof-secret-000000000000000000000000
                  USDT_WALLET_ENCRYPTION_KEY: build-check-usdt-wallet-key-000000000000000000000000
                  USDT_REFUND_SENDER_ADDRESSES: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
                  STOREFRONT_PROMOTION_GATE_ENABLED: 'false'
                  STOREFRONT_ENTRY_SECRET: build-check-entry-secret-000000000000000000000000
                  DB: postgres
                  DB_USERNAME: build-check
                  DB_PASSWORD: build-check-password
                  DB_NAME: build-check
                  DB_SYNCHRONIZE: 'false'
              run: bun run build

            - name: Validate prompt Skill release
              run: bun run --cwd packages/image-generation-plugin test:skill

            - name: Run release-only checks
              run: |
                  bun run check-imports
                  bun run check-core-type-defs
                  bun run check-angular-versions

            - name: Confirm source remained clean
              run: test -z "$(git status --porcelain)"

            - name: Build and verify production runtime
              env:
                  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  ARTIFACT_NAME="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-linux-x64"
                  ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts/production-runtime/$ARTIFACT_NAME"
                  ARCHIVE_DIR="$RUNNER_TEMP/production-runtime"
                  ARCHIVE_PATH="$ARCHIVE_DIR/$ARTIFACT_NAME.tar.gz"
                  mkdir -p "$ARCHIVE_DIR"

                  bun run --cwd packages/dev-server build:production-runtime -- \
                    --output "$ARTIFACT_DIR" \
                    --require-platform linux/x64 \
                    --audit-level high \
                    --audit-report "$BUN_AUDIT_REPORT"
                  node "$ARTIFACT_DIR/verify-runtime.mjs" --expected-sha "$TARGET_SHA"
                  test "$(stat --format='%a' "$ARTIFACT_DIR")" = "755"

                  tar --create --gzip --file "$ARCHIVE_PATH" \
                    --directory "$(dirname "$ARTIFACT_DIR")" \
                    "$ARTIFACT_NAME"
                  (
                    cd "$ARCHIVE_DIR"
                    sha256sum "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"
                  )
                  jq -n \
                    --arg archiveName "$(basename "$ARCHIVE_PATH")" \
                    --arg archiveSha256 "$(cut -d ' ' -f 1 "$ARCHIVE_PATH.sha256")" \
                    --argjson authVisuals "$AUTH_VISUALS" \
                    --arg mediaChannelCodes "$MEDIA_CHANNEL_CODES" \
                    --arg mediaKeys "$MEDIA_KEYS" \
                    --arg sourceRunId "$GITHUB_RUN_ID" \
                    --arg targetSha "$TARGET_SHA" \
                    '{archiveName: $archiveName, archiveSha256: $archiveSha256, authVisuals: $authVisuals, format: 1, mediaChannelCodes: $mediaChannelCodes, mediaKeys: $mediaKeys, sourceRunId: $sourceRunId, targetSha: $targetSha}' \
                    > "$ARCHIVE_DIR/release-plan.json"
                  (
                    cd "$ARCHIVE_DIR"
                    sha256sum release-plan.json > release-plan.json.sha256
                  )

                  echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
                  echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"
                  echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
                  echo "ARCHIVE_CHECKSUM_PATH=$ARCHIVE_PATH.sha256" >> "$GITHUB_ENV"

            - name: Record release evidence
              env:
                  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  {
                    echo "## Production runtime"
                    echo
                    echo "- Target SHA: \`$TARGET_SHA\`"
                    echo "- Runner: \`linux/x64\`"
                    echo "- Node: \`$(node --version)\`"
                    echo "- Bun: \`$(bun --version)\`"
                    echo "- Validated CI run: \`$CI_RUN_ID\`"
                    echo "- Reviewed head: \`$REVIEWED_HEAD_SHA\`"
                    echo "- Source tree: \`$TARGET_TREE\`"
                    echo "- Archive: \`$(basename "$ARCHIVE_PATH")\`"
                    echo "- Archive SHA-256: \`$(cut -d ' ' -f 1 "$ARCHIVE_CHECKSUM_PATH")\`"
                    if [[ -n "$MEDIA_KEYS" ]]; then
                      echo "- Reviewed media keys: \`$MEDIA_KEYS\`"
                    else
                      echo '- Reviewed media keys: `none`'
                    fi
                    echo "- Reviewed auth visuals: \`$AUTH_VISUALS\`"
                    if [[ -n "$MEDIA_CHANNEL_CODES" ]]; then
                      echo "- Reviewed Channel codes: \`$MEDIA_CHANNEL_CODES\`"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
                  node - "$ARTIFACT_DIR/RUNTIME-AUDIT.json" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
                  const report = require(process.argv[2]);
                  process.stdout.write(`- Runtime audit: ${report.summary.total} total, ${report.summary.high} high, ${report.summary.critical} critical\n`);
                  NODE

            - name: Upload immutable runtime archive
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: production-runtime-${{ inputs.target_sha || github.sha }}
                  path: ${{ runner.temp }}/production-runtime/
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 0
