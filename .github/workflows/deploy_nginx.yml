name: Deploy Reviewed Nginx Configuration
on:
    workflow_call:
        inputs:
            target_sha:
                required: true
                type: string
            base_sha:
                required: true
                type: string
            storefront_sha:
                required: true
                type: string
            admin_sha:
                required: true
                type: string
            ci_run_id:
                required: true
                type: string
permissions:
    contents: read
    actions: read
    pull-requests: read
    id-token: write
jobs:
    deploy:
        name: validate and reload Nginx without stopping serving processes
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            BASE_SHA: ${{ inputs.base_sha }}
            STOREFRONT_SHA: ${{ inputs.storefront_sha }}
            ADMIN_SHA: ${{ inputs.admin_sha }}
            CI_RUN_ID: ${{ inputs.ci_run_id }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha }}
                  fetch-depth: 0
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: '24.19.0'
            - name: Verify the exact source, cumulative scope and successful checks
              run: |
                  [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
                  node deploy/nginx-release.mjs scope "$BASE_SHA" "$TARGET_SHA" "$STOREFRONT_SHA" "$ADMIN_SHA"
                  node scripts/release-evidence.mjs verify "$BASE_SHA" "$TARGET_SHA" "$CI_RUN_ID"
            - name: Package only the reviewed Nginx configuration
              id: archive
              run: |
                  name="nginx-${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
                  tar -czf "$RUNNER_TEMP/$name" -C deploy/nginx damatong.conf
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  echo "sha256=$(sha256sum "$RUNNER_TEMP/$name" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
                  echo "config_sha256=$(sha256sum deploy/nginx/damatong.conf | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
            - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
              with:
                  role-to-assume: arn:aws:iam::098208446664:role/yunqiao-vendure-github-deploy
                  aws-region: ap-northeast-1
                  role-session-name: vendure-nginx-${{ github.run_id }}
            - name: Store the immutable configuration artifact
              env:
                  ARCHIVE: ${{ steps.archive.outputs.name }}
              run: aws s3 cp "$RUNNER_TEMP/$ARCHIVE" "s3://yunqiao-vendure-prod-backup-098208446664-apne1/deployments/$TARGET_SHA/$ARCHIVE" --only-show-errors
            - name: Back up, validate, reload and verify the three stores
              env:
                  NGINX_RECEIPT_PATH: ${{ runner.temp }}/nginx-acceptance.json
                  ARCHIVE: ${{ steps.archive.outputs.name }}
                  ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
                  CONFIG_SHA256: ${{ steps.archive.outputs.config_sha256 }}
              run: node deploy/nginx-ssm.mjs
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: nginx-acceptance-${{ inputs.target_sha }}
                  path: ${{ runner.temp }}/nginx-acceptance.json
                  if-no-files-found: error
