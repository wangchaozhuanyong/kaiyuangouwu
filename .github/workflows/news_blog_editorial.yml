name: News Blog Editorial
run-name: Skill editorial / ${{ inputs.request_id }}
on:
    workflow_dispatch:
        inputs:
            request_id:
                description: Client correlation ID
                type: string
                required: true
            mode:
                description: Inspect MOYAO Skill articles or publish verified editorial content
                type: choice
                options: [inspect, publish, rewrite]
                default: inspect
            expected_runtime_sha:
                description: Runtime SHA returned by inspect; required for publish
                type: string
                default: ''
            payload:
                description: Structured public Skill content JSON; never credentials or executable code
                type: string
                default: '{}'
permissions:
    contents: read
    id-token: write
concurrency:
    group: production-deploy
    cancel-in-progress: false
jobs:
    editorial:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            AWS_REGION: ap-northeast-1
            MODE: ${{ inputs.mode }}
            PAYLOAD: ${{ inputs.payload }}
            EXPECTED_RUNTIME_SHA: ${{ inputs.expected_runtime_sha }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  persist-credentials: false
            - name: Validate main and build data-only operation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -Eeuo pipefail
                  test "$GITHUB_REF" = refs/heads/main
                  test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
                  python3 - <<'PY'
                  import base64, json, os, re, lzma
                  from pathlib import Path
                  payload = json.loads(os.environ['PAYLOAD'])
                  request = {'mode': os.environ['MODE'], 'expectedRuntimeSha': os.environ['EXPECTED_RUNTIME_SHA'], 'payload': payload}
                  assert request['mode'] in ('inspect', 'publish', 'rewrite')
                  if request['mode'] != 'inspect':
                      assert re.fullmatch('[a-f0-9]{40}', request['expectedRuntimeSha'])
                      entries = payload if request['mode'] == 'rewrite' else [payload]
                      assert isinstance(entries, list) and 1 <= len(entries) <= 4
                      for entry in entries:
                          assert re.fullmatch('codex-skill:[a-zA-Z0-9:_-]{8,120}', entry.get('requestKey', ''))
                          if request['mode'] == 'rewrite': assert entry.get('articleId') and entry.get('expectedVersion', 0) > 0
                  raw = json.dumps(request, ensure_ascii=False).encode()
                  assert len(raw) <= 45000
                  files = {name: base64.b64encode(Path(name).read_bytes()).decode() for name in (
                      'deploy/news-blog-editorial.cjs', 'deploy/systemd/vendure-production-release-retention.cjs'
                  )}
                  bundle = base64.b64encode(lzma.compress(json.dumps(files).encode())).decode()
                  unpack = "import base64,json,pathlib,sys,lzma; root=pathlib.Path(sys.argv[1]); files=json.loads(lzma.decompress(base64.b64decode(sys.argv[2]))); [(root.joinpath(k).parent.mkdir(parents=True,exist_ok=True),root.joinpath(k).write_bytes(base64.b64decode(v))) for k,v in files.items()]"
                  lines = ['set -Eeuo pipefail', 'umask 077', 'test -f /run/lock/vendure-production-deploy.lock',
                           'task_dir="$(mktemp -d /var/www/kaiyuangouwu/backups/news-blog-editorial-run.XXXXXX)"',
                           'chmod 755 "$task_dir"',
                           "python3 -c " + __import__('shlex').quote(unpack) + ' "$task_dir" ' + __import__('shlex').quote(bundle),
                           'find "$task_dir" -type d -exec chmod 755 {} +',
                           'find "$task_dir" -type f -exec chmod 644 {} +',
                           "printf '%s' '" + base64.b64encode(raw).decode() + "' | base64 -d | flock --exclusive --wait 300 /run/lock/vendure-production-deploy.lock node \"$task_dir/deploy/news-blog-editorial.cjs\""]
                  parameters = json.dumps({'commands': lines})
                  assert len(parameters.encode()) <= 80000
                  Path(os.environ['RUNNER_TEMP'], 'editorial-ssm.json').write_text(parameters)
                  PY
            - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: arn:aws:iam::098208446664:role/yunqiao-vendure-github-deploy
                  aws-region: ap-northeast-1
                  allowed-account-ids: '098208446664'
            - name: Execute serialized content operation
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -Eeuo pipefail
                  test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
                  command_id="$(aws ssm send-command --instance-ids i-01d6737449bc52460 --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/editorial-ssm.json" --timeout-seconds 600 --query Command.CommandId --output text)"
                  for attempt in $(seq 1 120); do
                    state="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-01d6737449bc52460 --query Status --output text)"
                    case "$state" in Success|Failed|Cancelled|TimedOut) break ;; esac
                    sleep 5
                  done
                  aws ssm get-command-invocation --command-id "$command_id" --instance-id i-01d6737449bc52460 --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' --output json > "$RUNNER_TEMP/editorial-result.json"
                  jq -e '.Status == "Success" and .ResponseCode == 0 and (.Output | contains("NEWS_BLOG_EDITORIAL_RESULT "))' "$RUNNER_TEMP/editorial-result.json"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              if: always()
              with:
                  name: news-blog-editorial-result
                  path: ${{ runner.temp }}/editorial-result.json
                  retention-days: 30
                  if-no-files-found: ignore
