name: Monitor Production Health

on:
    schedule:
        - cron: '17,47 * * * *'
    workflow_dispatch:
        inputs:
            audit_payment_config:
                description: Run the masked production payment configuration audit
                required: false
                default: false
                type: boolean
            audit_realtime_capacity:
                description: Run the isolated 8/12/13 storefront realtime capacity and release audit
                required: false
                default: false
                type: boolean
            audit_memory_processes:
                description: Report masked memory breakdown and process usage without changing the host
                required: false
                default: false
                type: boolean

permissions:
    contents: read
    id-token: write

concurrency:
    group: production-health-monitor
    cancel-in-progress: false

jobs:
    monitor:
        name: check production memory and processes through AWS SSM
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env:
            AWS_REGION: ap-northeast-1
            AWS_ACCOUNT_ID: '079740175286'
            AWS_ROLE_ARN: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
            INSTANCE_ID: i-041a146558e432cbf

        steps:
            - name: Configure short-lived AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ env.AWS_ROLE_ARN }}
                  role-session-name: vendure-health-monitor-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

            - name: Audit masked production memory consumers
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_memory_processes }}
              shell: bash
              run: |
                  set -Eeuo pipefail
                  remote_command=$(cat <<'REMOTE_COMMAND'
                  set -eu
                  awk '/^(MemTotal|MemAvailable|SwapTotal|SwapFree|AnonPages|Shmem|SReclaimable|SUnreclaim|Slab):/ {printf "MEMORY_DIAG %s %s_kib\n", $1, $2}' /proc/meminfo
                  ps -eo comm=,rss= --sort=-rss | awk 'NR <= 15 {printf "PROCESS_MEMORY rank=%d name=%s rss_mib=%.1f\n", NR, $1, $2 / 1024}'
                  sudo -n -H -u ubuntu pm2 jlist | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk);process.stdin.on("end",()=>{for(const entry of JSON.parse(input)){if(["vendure-api","vendure-worker"].includes(entry.name)){console.log(`PM2_MEMORY name=${entry.name} pid=${entry.pid} rss_mib=${((entry.monit?.memory??0)/1048576).toFixed(1)} restarts=${entry.pm2_env?.restart_time??0}`)}}})'
                  REMOTE_COMMAND
                  )
                  jq -n --arg command "$remote_command" \
                    '{commands: [$command], executionTimeout: ["120"]}' > "$RUNNER_TEMP/memory-audit-ssm-parameters.json"
                  command_id="$(aws ssm send-command \
                    --region "$AWS_REGION" \
                    --document-name AWS-RunShellScript \
                    --instance-ids "$INSTANCE_ID" \
                    --comment 'Audit masked Vendure host memory consumers' \
                    --parameters "file://$RUNNER_TEMP/memory-audit-ssm-parameters.json" \
                    --timeout-seconds 120 \
                    --query 'Command.CommandId' \
                    --output text)"
                  test -n "$command_id"
                  status=Pending
                  for attempt in $(seq 1 24); do
                    status="$(aws ssm get-command-invocation \
                      --region "$AWS_REGION" \
                      --command-id "$command_id" \
                      --instance-id "$INSTANCE_ID" \
                      --query Status \
                      --output text 2>/dev/null || true)"
                    case "$status" in
                      Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
                    esac
                    sleep 5
                  done
                  aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$command_id" \
                    --instance-id "$INSTANCE_ID" \
                    --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                    --output json | tee "$RUNNER_TEMP/memory-audit.json"
                  test "$status" = Success
                  {
                    echo '## Masked production memory audit'
                    echo
                    echo "- SSM command: \`$command_id\`"
                    echo '```text'
                    jq -r '.Output' "$RUNNER_TEMP/memory-audit.json"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Check out the audited revision
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_payment_config }}
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

            - name: Audit masked production payment configuration
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_payment_config }}
              shell: bash
              run: |
                  set -Eeuo pipefail

                  echo 'AWS_PARAMETER_INVENTORY status=skipped access=not_granted_by_design'
                  echo 'AWS_SECRET_INVENTORY status=skipped access=not_granted_by_design'

                  audit_script_b64="$(base64 -w0 deploy/audit-production-payment-config.mjs)"
                  remote_command="printf '%s' '${audit_script_b64}' | base64 -d | node"
                  jq -n --arg command "$remote_command" \
                    '{commands: [$command], executionTimeout: ["300"]}' > "$RUNNER_TEMP/payment-audit-ssm-parameters.json"

                  command_id="$(aws ssm send-command \
                    --region "$AWS_REGION" \
                    --document-name AWS-RunShellScript \
                    --instance-ids "$INSTANCE_ID" \
                    --comment 'Audit masked Vendure payment configuration' \
                    --parameters "file://$RUNNER_TEMP/payment-audit-ssm-parameters.json" \
                    --timeout-seconds 120 \
                    --query 'Command.CommandId' \
                    --output text)"
                  test -n "$command_id"

                  status=Pending
                  for attempt in $(seq 1 60); do
                    status="$(aws ssm get-command-invocation \
                      --region "$AWS_REGION" \
                      --command-id "$command_id" \
                      --instance-id "$INSTANCE_ID" \
                      --query Status \
                      --output text 2>/dev/null || true)"
                    case "$status" in
                      Success|Failed|Cancelled|TimedOut|Cancelling)
                        break
                        ;;
                    esac
                    sleep 5
                  done

                  aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$command_id" \
                    --instance-id "$INSTANCE_ID" \
                    --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                    --output json | tee "$RUNNER_TEMP/payment-config-audit.json"
                  test "$status" = Success

                  {
                    echo '## Masked production payment configuration audit'
                    echo
                    echo "- SSM command: \`$command_id\`"
                    echo "- Status: \`$status\`"
                    echo '- Account-wide parameter and secret name inventories: `skipped (not granted by design)`'
                    echo
                    echo '```text'
                    jq -r '.Output' "$RUNNER_TEMP/payment-config-audit.json"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Check production health
              run: |
                  REALTIME_CAPACITY_AUDIT=false
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
                     [ "${{ inputs.audit_realtime_capacity }}" = "true" ]; then
                      REALTIME_CAPACITY_AUDIT=true
                  fi
                  REMOTE_COMMAND="sudo -H -u ubuntu env AUDIT_STOREFRONT_REALTIME_CAPACITY=${REALTIME_CAPACITY_AUDIT} /bin/bash /var/www/kaiyuangouwu/deploy/monitor-production-health.sh"
                  jq -n --arg command "$REMOTE_COMMAND" \
                    '{commands: [$command], executionTimeout: ["300"]}' > "$RUNNER_TEMP/ssm-parameters.json"

                  COMMAND_ID="$(aws ssm send-command \
                    --region "$AWS_REGION" \
                    --document-name AWS-RunShellScript \
                    --instance-ids "$INSTANCE_ID" \
                    --comment "Monitor Vendure production health" \
                    --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
                    --timeout-seconds 120 \
                    --query 'Command.CommandId' \
                    --output text)"
                  test -n "$COMMAND_ID"

                  status=Pending
                  for attempt in $(seq 1 60); do
                    status="$(aws ssm get-command-invocation \
                      --region "$AWS_REGION" \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query Status \
                      --output text 2>/dev/null || true)"
                    case "$status" in
                      Success|Failed|Cancelled|TimedOut|Cancelling)
                        break
                        ;;
                    esac
                    sleep 5
                  done

                  aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                    --output json | tee "$RUNNER_TEMP/production-health.json"
                  test "$status" = Success

                  {
                    echo "## Production health monitor"
                    echo
                    echo "- SSM command: \`$COMMAND_ID\`"
                    echo "- Status: \`$status\`"
                    echo
                    echo '```text'
                    jq -r '.Output' "$RUNNER_TEMP/production-health.json"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
