name: Deploy Production Runtime

on:
    workflow_run:
        workflows:
            - Production Runtime Artifact
        types:
            - completed

permissions:
    actions: read
    contents: read
    id-token: write

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy verified runtime through AWS SSM
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            (github.event.workflow_run.event == 'workflow_dispatch' ||
             github.event.workflow_run.event == 'push') &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            AWS_REGION: ap-northeast-1
            AWS_ACCOUNT_ID: '079740175286'
            AWS_ROLE_ARN: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
            INSTANCE_ID: i-041a146558e432cbf
            ARTIFACT_BUCKET: yunqiao-vendure-prod-backup-079740175286-apne1
            TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
            SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}

        steps:
            - name: Validate release identity
              run: |
                  if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "workflow_run head SHA is invalid" >&2
                    exit 1
                  fi

            - name: Download verified runtime artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: production-runtime-${{ github.event.workflow_run.head_sha }}
                  path: artifacts
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ github.event.workflow_run.id }}

            - name: Validate downloaded archive
              run: |
                  shopt -s nullglob
                  archives=(artifacts/*.tar.gz)
                  checksums=(artifacts/*.tar.gz.sha256)
                  release_plans=(artifacts/release-plan.json)
                  release_plan_checksums=(artifacts/release-plan.json.sha256)
                  test "${#archives[@]}" -eq 1
                  test "${#checksums[@]}" -eq 1
                  test "${#release_plans[@]}" -eq 1
                  test "${#release_plan_checksums[@]}" -eq 1

                  ARCHIVE_PATH="${archives[0]}"
                  ARCHIVE_NAME="$(basename "$ARCHIVE_PATH")"
                  ARTIFACT_NAME="${ARCHIVE_NAME%.tar.gz}"
                  CHECKSUM_PATH="${checksums[0]}"
                  RELEASE_PLAN_PATH="${release_plans[0]}"
                  RELEASE_PLAN_CHECKSUM_PATH="${release_plan_checksums[0]}"

                  [[ "$ARTIFACT_NAME" =~ ^${TARGET_SHA}-[0-9]+-[0-9]+-linux-x64$ ]]
                  test "$(basename "$CHECKSUM_PATH")" = "${ARCHIVE_NAME}.sha256"
                  (
                    cd artifacts
                    sha256sum --check "$(basename "$CHECKSUM_PATH")"
                    sha256sum --check "$(basename "$RELEASE_PLAN_CHECKSUM_PATH")"
                  )
                  ARCHIVE_SHA256="$(cut -d ' ' -f 1 "$CHECKSUM_PATH")"
                  jq -e \
                    --arg archiveName "$ARCHIVE_NAME" \
                    --arg archiveSha256 "$ARCHIVE_SHA256" \
                    --arg runId "$SOURCE_RUN_ID" \
                    --arg sha "$TARGET_SHA" '
                    .format == 1 and
                    .archiveName == $archiveName and
                    .archiveSha256 == $archiveSha256 and
                    .sourceRunId == $runId and
                    .targetSha == $sha and
                    (.authVisuals | type == "boolean") and
                    (.damatongChannelToken | type == "string") and
                    (.damatongStorefront | type == "boolean") and
                    (.damatongPublishReview | type == "string") and
                    (.moyaoBrand | type == "boolean") and
                    (.homepageCarousel | type == "boolean") and
                    (.referralPosters | type == "string") and
                    (.mediaChannelCodes | type == "string") and
                    (.mediaKeys | type == "string")
                  ' "$RELEASE_PLAN_PATH" >/dev/null
                  MEDIA_CHANNEL_CODES="$(jq -r '.mediaChannelCodes' "$RELEASE_PLAN_PATH")"
                  MEDIA_KEYS="$(jq -r '.mediaKeys' "$RELEASE_PLAN_PATH")"
                  AUTH_VISUALS="$(jq -r '.authVisuals' "$RELEASE_PLAN_PATH")"
                  DAMATONG_CHANNEL_TOKEN="$(jq -r '.damatongChannelToken' "$RELEASE_PLAN_PATH")"
                  DAMATONG_STOREFRONT="$(jq -r '.damatongStorefront' "$RELEASE_PLAN_PATH")"
                  DAMATONG_PUBLISH_REVIEW="$(jq -r '.damatongPublishReview' "$RELEASE_PLAN_PATH")"
                  MOYAO_BRAND="$(jq -r '.moyaoBrand' "$RELEASE_PLAN_PATH")"
                  REFERRAL_POSTERS="$(jq -r '.referralPosters' "$RELEASE_PLAN_PATH")"
                  HOMEPAGE_CAROUSEL="$(jq -r '.homepageCarousel' "$RELEASE_PLAN_PATH")"
                  if [[ -n "$MEDIA_KEYS" ]] && [[ ! "$MEDIA_KEYS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]]; then
                    echo 'release plan contains invalid reviewed media keys' >&2
                    exit 1
                  fi
                  if [[ -n "$MEDIA_CHANNEL_CODES" ]] && [[ ! "$MEDIA_CHANNEL_CODES" =~ ^[a-z0-9_][a-z0-9_-]*(,[a-z0-9_][a-z0-9_-]*)*$ ]]; then
                    echo 'release plan contains invalid reviewed Channel codes' >&2
                    exit 1
                  fi
                  case "$REFERRAL_POSTERS" in
                    none|primary|both-stores) ;;
                    *) echo 'Invalid reviewed referral poster scope' >&2; exit 1 ;;
                  esac
                  if [[ "$AUTH_VISUALS" != "true" && "$AUTH_VISUALS" != "false" ]]; then
                    echo 'release plan contains an invalid auth visual flag' >&2
                    exit 1
                  fi
                  if [[ "$MOYAO_BRAND" != "true" && "$MOYAO_BRAND" != "false" ]]; then
                    echo 'release plan contains an invalid MOYAO AI brand flag' >&2
                    exit 1
                  fi
                  if [[ "$DAMATONG_STOREFRONT" != "true" && "$DAMATONG_STOREFRONT" != "false" ]]; then
                    echo 'release plan contains an invalid Damatong storefront flag' >&2
                    exit 1
                  fi
                  if [[ -n "$DAMATONG_CHANNEL_TOKEN" ]] && [[ ! "$DAMATONG_CHANNEL_TOKEN" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                    echo 'release plan contains an invalid Damatong Channel token' >&2
                    exit 1
                  fi
                  if [[ ( -n "$MEDIA_KEYS" || "$AUTH_VISUALS" == "true" || "$MOYAO_BRAND" == "true" ) && -z "$MEDIA_CHANNEL_CODES" ]]; then
                    echo 'release plan is missing reviewed Channel codes' >&2
                    exit 1
                  fi
                  if [[ -z "$MEDIA_KEYS" && "$AUTH_VISUALS" == "false" && "$MOYAO_BRAND" == "false" && -n "$MEDIA_CHANNEL_CODES" ]]; then
                    echo 'release plan contains Channel codes without a managed publisher' >&2
                    exit 1
                  fi
                  if [[ "$MOYAO_BRAND" == "true" && "$MEDIA_CHANNEL_CODES" != "__default_channel__" ]]; then
                    echo 'reviewed MOYAO AI brand requires the primary Channel only' >&2
                    exit 1
                  fi
                  if [[ "$HOMEPAGE_CAROUSEL" != "true" && "$HOMEPAGE_CAROUSEL" != "false" ]]; then
                    echo 'release plan contains an invalid homepage carousel flag' >&2
                    exit 1
                  fi
                  if [[ "$HOMEPAGE_CAROUSEL" == "true" ]]; then
                    if [[ "$MEDIA_CHANNEL_CODES" != "__default_channel__" || "$MEDIA_KEYS" != "home-hero-token-topup-v1,home-hero-codex-tiers-v1,home-hero-account-services-v1" ]]; then
                      echo 'reviewed homepage carousel requires the primary Channel and its exact three media keys' >&2
                      exit 1
                    fi
                  fi
                  if [[ "$DAMATONG_STOREFRONT" == "true" && "$DAMATONG_CHANNEL_TOKEN" != "my-malaysia" ]]; then
                    echo 'reviewed Damatong storefront requires the my-malaysia Channel token' >&2
                    exit 1
                  fi
                  if [[ "$DAMATONG_STOREFRONT" == "false" && -n "$DAMATONG_CHANNEL_TOKEN" ]]; then
                    echo 'release plan contains a Damatong Channel token without its publisher' >&2
                    exit 1
                  fi

                  if [[ "$DAMATONG_STOREFRONT" == "true" ]]; then
                    [[ "$DAMATONG_PUBLISH_REVIEW" == "preserve-existing" || "$DAMATONG_PUBLISH_REVIEW" =~ ^[a-f0-9]{64}$ ]] || {
                      echo 'Damatong release requires preserve-existing or the reviewed dry-run SHA-256' >&2
                      exit 1
                    }
                  elif [[ -n "$DAMATONG_PUBLISH_REVIEW" ]]; then
                    echo 'Damatong review requires its explicit release scope' >&2
                    exit 1
                  fi

                  echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
                  echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
                  echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
                  echo "CHECKSUM_PATH=$CHECKSUM_PATH" >> "$GITHUB_ENV"
                  echo "ARTIFACT_S3_PREFIX=s3://${ARTIFACT_BUCKET}/deployments/${TARGET_SHA}" >> "$GITHUB_ENV"
                  echo "MEDIA_CHANNEL_CODES=$MEDIA_CHANNEL_CODES" >> "$GITHUB_ENV"
                  echo "MEDIA_KEYS=$MEDIA_KEYS" >> "$GITHUB_ENV"
                  echo "AUTH_VISUALS=$AUTH_VISUALS" >> "$GITHUB_ENV"
                  echo "DAMATONG_CHANNEL_TOKEN=$DAMATONG_CHANNEL_TOKEN" >> "$GITHUB_ENV"
                  echo "DAMATONG_STOREFRONT=$DAMATONG_STOREFRONT" >> "$GITHUB_ENV"
                  echo "DAMATONG_PUBLISH_REVIEW=$DAMATONG_PUBLISH_REVIEW" >> "$GITHUB_ENV"
                  echo "MOYAO_BRAND=$MOYAO_BRAND" >> "$GITHUB_ENV"
                  echo "REFERRAL_POSTERS=$REFERRAL_POSTERS" >> "$GITHUB_ENV"
                  echo "HOMEPAGE_CAROUSEL=$HOMEPAGE_CAROUSEL" >> "$GITHUB_ENV"

            - name: Configure short-lived AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ env.AWS_ROLE_ARN }}
                  role-session-name: vendure-production-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

            - name: Upload immutable runtime to private S3
              run: |
                  aws s3 cp "$ARCHIVE_PATH" "$ARTIFACT_S3_PREFIX/$ARCHIVE_NAME" --only-show-errors
                  aws s3 cp "$CHECKSUM_PATH" "$ARTIFACT_S3_PREFIX/$ARCHIVE_NAME.sha256" --only-show-errors

            - name: Deploy through Systems Manager
              run: |
                  REMOTE_COMMAND="sudo -H -u ubuntu env GITHUB_RUN_ID='${GITHUB_RUN_ID}' VENDURE_REVIEWED_STOREFRONT_MEDIA_KEYS='${MEDIA_KEYS}' VENDURE_REVIEWED_STOREFRONT_MEDIA_CHANNEL_CODES='${MEDIA_CHANNEL_CODES}' VENDURE_REVIEWED_AUTH_VISUALS='${AUTH_VISUALS}' VENDURE_REVIEWED_MOYAO_BRAND='${MOYAO_BRAND}' VENDURE_REVIEWED_DAMATONG_STOREFRONT='${DAMATONG_STOREFRONT}' VENDURE_REVIEWED_DAMATONG_CHANNEL_TOKEN='${DAMATONG_CHANNEL_TOKEN}' VENDURE_REVIEWED_DAMATONG_PUBLISH_REVIEW='${DAMATONG_PUBLISH_REVIEW}' VENDURE_REVIEWED_HOMEPAGE_CAROUSEL='${HOMEPAGE_CAROUSEL}' VENDURE_REVIEWED_REFERRAL_POSTERS='${REFERRAL_POSTERS}' /usr/local/sbin/vendure-production-deploy-from-s3 '${TARGET_SHA}' '${ARTIFACT_NAME}' '${ARTIFACT_S3_PREFIX}'"
                  jq -n --arg command "$REMOTE_COMMAND" \
                    '{commands: [$command], executionTimeout: ["3600"]}' > "$RUNNER_TEMP/ssm-parameters.json"

                  COMMAND_ID="$(aws ssm send-command \
                    --region "$AWS_REGION" \
                    --document-name AWS-RunShellScript \
                    --instance-ids "$INSTANCE_ID" \
                    --comment "GitHub production deploy ${TARGET_SHA}" \
                    --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
                    --timeout-seconds 600 \
                    --query 'Command.CommandId' \
                    --output text)"
                  test -n "$COMMAND_ID"

                  status=Pending
                  for attempt in $(seq 1 360); do
                    status="$(aws ssm get-command-invocation \
                      --region "$AWS_REGION" \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query Status \
                      --output text 2>/dev/null || true)"
                    case "$status" in
                      Success)
                        break
                        ;;
                      Failed|Cancelled|TimedOut|Cancelling)
                        break
                        ;;
                    esac
                    sleep 5
                  done

                  SSM_RESULT="$RUNNER_TEMP/ssm-result.json"
                  aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --output json > "$SSM_RESULT"

                  jq '{Status, ResponseCode}' "$SSM_RESULT"
                  if [[ "$status" == Success ]]; then
                    jq -r '.StandardOutputContent // ""' "$SSM_RESULT" |
                      grep -E '^(PRODUCTION_|DEPLOY_|STOREFRONT_MEDIA_|AUTH_VISUAL_|MOYAO_BRAND_|DAMATONG_|HOMEPAGE_CAROUSEL_|REFERRAL_POSTERS_|Runtime artifact verified)' |
                      tail -n 120 || true
                  else
                    {
                      echo '--- remote output tail ---'
                      jq -r '.StandardOutputContent // ""' "$SSM_RESULT"
                      echo '--- remote error tail ---'
                      jq -r '.StandardErrorContent // ""' "$SSM_RESULT"
                    } | tail -n 160
                  fi

                  {
                    echo "## Production deployment"
                    echo
                    echo "- Target SHA: \`$TARGET_SHA\`"
                    echo "- Artifact: \`$ARTIFACT_NAME\`"
                    if [[ -n "$MEDIA_KEYS" ]]; then
                      echo "- Reviewed media keys: \`$MEDIA_KEYS\`"
                    else
                      echo '- Reviewed media keys: `none`'
                    fi
                    echo "- Reviewed referral posters: \`$REFERRAL_POSTERS\`"
                    echo "- Reviewed auth visuals: \`$AUTH_VISUALS\`"
                    echo "- Reviewed MOYAO AI brand: \`$MOYAO_BRAND\`"
                    echo "- Reviewed Damatong storefront: \`$DAMATONG_STOREFRONT\`"
                    if [[ -n "$DAMATONG_CHANNEL_TOKEN" ]]; then
                      echo "- Reviewed Damatong Channel token: \`$DAMATONG_CHANNEL_TOKEN\`"
                    fi
                    if [[ -n "$MEDIA_CHANNEL_CODES" ]]; then
                      echo "- Reviewed Channel codes: \`$MEDIA_CHANNEL_CODES\`"
                    fi
                    echo "- SSM command: \`$COMMAND_ID\`"
                    echo "- Status: \`$status\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  test "$status" = Success
