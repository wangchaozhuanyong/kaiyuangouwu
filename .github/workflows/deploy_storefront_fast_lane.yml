name: Deploy Storefront Fast Lane

on:
    workflow_dispatch:
        inputs:
            target_sha:
                description: 'Full 40-character SHA at origin/main (optional, defaults to HEAD)'
                required: false
                default: ''
                type: string

permissions:
    actions: read
    contents: read
    id-token: write

concurrency:
    group: storefront-fast-lane
    cancel-in-progress: false

jobs:
    deploy-fast-lane:
        name: fast build and deploy storefront
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            AWS_REGION: ap-northeast-1
            AWS_ACCOUNT_ID: '079740175286'
            AWS_ROLE_ARN: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
            INSTANCE_ID: i-041a146558e432cbf
            ARTIFACT_BUCKET: yunqiao-vendure-prod-backup-079740175286-apne1
        steps:
            - name: Checkout repository
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha || github.sha }}
                  fetch-depth: 0

            - name: Verify requested main commit
              env:
                  REQUESTED_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  [[ "$REQUESTED_SHA" =~ ^[a-f0-9]{40}$ ]]
                  git fetch origin main --no-tags
                  test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
                  test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"

            - name: Setup Bun
              uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
              with:
                  bun-version: '1.3.14'

            - name: Check atomic deployment guards
              run: |
                  node --test deploy/storefront-release.test.mjs
                  bash -n deploy/deploy-storefront-from-s3.sh deploy/deploy-production-from-s3.sh

            - name: Install Storefront Dependencies
              run: bun install --frozen-lockfile --linker=hoisted

            - name: Build Storefront
              env:
                  NODE_ENV: production
              run: bun run --cwd packages/storefront build

            - name: Verify build artifacts
              run: |
                  test -f packages/storefront/dist/index.html
                  echo "Storefront build verified successfully"

            - name: Package Storefront Artifact
              id: pack
              env:
                  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
              run: |
                  ARCHIVE_NAME="storefront-fast-${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
                  tar -czf "$ARCHIVE_NAME" -C packages/storefront/dist .
                  sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
                  echo "archive_sha256=$(sha256sum "$ARCHIVE_NAME" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
                  echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
                  echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
              with:
                  role-to-assume: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
                  aws-region: ap-northeast-1
                  role-session-name: github-storefront-fast-deploy-${{ github.run_id }}
                  audience: sts.amazonaws.com

            - name: Upload Storefront to S3
              env:
                  ARCHIVE_NAME: ${{ steps.pack.outputs.archive_name }}
                  TARGET_SHA: ${{ steps.pack.outputs.target_sha }}
              run: |
                  aws s3 cp "$ARCHIVE_NAME" "s3://${ARTIFACT_BUCKET}/deployments/${TARGET_SHA}/$ARCHIVE_NAME" --only-show-errors

            - name: Deploy Storefront to Production Nginx via SSM
              env:
                  ARCHIVE_SHA256: ${{ steps.pack.outputs.archive_sha256 }}
                  ARCHIVE_NAME: ${{ steps.pack.outputs.archive_name }}
                  TARGET_SHA: ${{ steps.pack.outputs.target_sha }}
              run: |
                  python3 - <<'PY'
                  import json
                  import os
                  import shlex
                  from pathlib import Path

                  command = [
                      'sudo', '-H', '-u', 'ubuntu', '/bin/bash',
                      '/var/www/kaiyuangouwu/deploy/deploy-storefront-from-s3.sh',
                      os.environ['TARGET_SHA'], os.environ['ARCHIVE_NAME'], os.environ['ARCHIVE_SHA256'],
                  ]
                  script = 'set -eu\n' + shlex.join(command)

                  payload = json.dumps({'commands': [script], 'executionTimeout': ['600']})
                  Path(os.environ['RUNNER_TEMP'], 'ssm-parameters.json').write_text(payload)
                  PY

                  COMMAND_ID="$(aws ssm send-command \
                    --region "$AWS_REGION" \
                    --document-name AWS-RunShellScript \
                    --instance-ids "$INSTANCE_ID" \
                    --comment "Storefront fast lane ${TARGET_SHA}" \
                    --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
                    --timeout-seconds 600 \
                    --query 'Command.CommandId' \
                    --output text)"
                  test -n "$COMMAND_ID"

                  echo "Submitted SSM command $COMMAND_ID. Polling execution status..."
                  status=Pending
                  for attempt in $(seq 1 210); do
                    status="$(aws ssm get-command-invocation \
                      --region "$AWS_REGION" \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query Status \
                      --output text 2>/dev/null || true)"
                    case "$status" in
                      Success|Failed|Cancelled|TimedOut|Cancelling)
                        break
                        ;;
                    esac
                    sleep 3
                  done

                  SSM_RESULT="$RUNNER_TEMP/ssm-result.json"
                  aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --output json > "$SSM_RESULT"

                  echo "SSM Command Final Status: $status"
                  echo "--- Remote stdout ---"
                  jq -r '.StandardOutputContent // ""' "$SSM_RESULT"
                  echo "--- Remote stderr ---"
                  jq -r '.StandardErrorContent // ""' "$SSM_RESULT"

                  if [[ "$status" != "Success" ]]; then
                    echo "SSM command failed" >&2
                    exit 1
                  fi
                  echo "Storefront fast lane successfully deployed!"
