name: Deploy Storefront Fast Lane

on:
    workflow_dispatch:
        inputs:
            target_sha:
                description: 'Full 40-character SHA at origin/main (optional, defaults to HEAD)'
                required: false
                default: ''
                type: string

permissions:
    actions: read
    contents: read
    id-token: write

concurrency:
    group: storefront-fast-lane
    cancel-in-progress: false

jobs:
    deploy-fast-lane:
        name: fast build and deploy storefront
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env:
            AWS_REGION: ap-northeast-1
            AWS_ACCOUNT_ID: '079740175286'
            AWS_ROLE_ARN: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
            INSTANCE_ID: i-041a146558e432cbf
            ARTIFACT_BUCKET: yunqiao-vendure-prod-backup-079740175286-apne1
        steps:
            - name: Checkout repository
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha || github.sha }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5
              with:
                  bun-version: 1.2.4

            - name: Install Storefront Dependencies
              run: bun install --frozen-lockfile --filter @vendure/storefront

            - name: Build Storefront
              env:
                  NODE_ENV: production
              run: bun --filter @vendure/storefront run build

            - name: Verify build artifacts
              run: |
                  test -f packages/storefront/dist/index.html
                  echo "Storefront build verified successfully"

            - name: Package Storefront Artifact
              id: pack
              run: |
                  ARCHIVE_NAME="storefront-fast-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"
                  tar -czf "$ARCHIVE_NAME" -C packages/storefront/dist .
                  sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
                  echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
              with:
                  role-to-assume: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
                  aws-region: ap-northeast-1
                  role-session-name: github-storefront-fast-deploy-${{ github.run_id }}
                  audience: sts.amazonaws.com

            - name: Upload Storefront to S3
              env:
                  ARCHIVE_NAME: ${{ steps.pack.outputs.archive_name }}
              run: |
                  aws s3 cp "$ARCHIVE_NAME" "s3://${ARTIFACT_BUCKET}/fast-lane/$ARCHIVE_NAME" --only-show-errors

            - name: Deploy Storefront to Production Nginx via SSM
              env:
                  ARCHIVE_NAME: ${{ steps.pack.outputs.archive_name }}
              run: |
                  COMMAND_ID="$(aws ssm send-command \
                    --instance-ids "$INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --parameters "commands=[
                      \"set -Eeuo pipefail\",
                      \"TEMP_DIR=\$(mktemp -d /tmp/storefront-fast-XXXXXX)\",
                      \"aws s3 cp s3://${ARTIFACT_BUCKET}/fast-lane/${ARCHIVE_NAME} \${TEMP_DIR}/${ARCHIVE_NAME} --only-show-errors\",
                      \"TARGET_DIST=\$(readlink -f /var/www/kaiyuangouwu-current/packages/storefront/dist)\",
                      \"mkdir -p \${TARGET_DIST}\",
                      \"tar -xzf \${TEMP_DIR}/${ARCHIVE_NAME} -C \${TARGET_DIST}\",
                      \"rm -rf \${TEMP_DIR}\",
                      \"echo STOREFRONT_FAST_LANE_DEPLOYED_OK\"
                    ]" \
                    --output text \
                    --query "Command.CommandId")"

                  echo "Submitted SSM command $COMMAND_ID. Waiting for completion..."
                  aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
                  STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)"
                  if [[ "$STATUS" != "Success" ]]; then
                    echo "SSM command failed with status: $STATUS" >&2
                    aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text >&2
                    exit 1
                  fi
                  echo "Storefront fast lane successfully deployed!"
