name: Deploy Storefront Fast Lane
on:
    workflow_dispatch:
        inputs:
            target_sha:
                description: 'Optional current main SHA; the unified entry selects the safe release scope'
                type: string
                default: ''
permissions:
    contents: read
    actions: read
    id-token: write
jobs:
    release:
        uses: ./.github/workflows/production_release.yml
        with:
            target_sha: ${{ inputs.target_sha || github.sha }}
