name: Complete Offsite File Restore Drill

on:
    workflow_call:
        inputs:
            target_sha:
                required: true
                type: string
    schedule:
        - cron: '0 22 * * 0'

permissions:
    contents: read
    id-token: write

jobs:
    restore:
        name: verify the latest offsite file backup before production switch
        runs-on: ubuntu-24.04
        timeout-minutes: 75
        concurrency:
            group: production-offsite-file-restore
            queue: max
        env:
            AWS_REGION: ap-northeast-1
            AWS_ACCOUNT_ID: '098208446664'
            AWS_ROLE_ARN: arn:aws:iam::098208446664:role/yunqiao-vendure-github-deploy
            INSTANCE_ID: ${{ vars.VENDURE_PRODUCTION_LIGHTSAIL_ACTIVE == 'true' && 'mi-04476e3f29a528ddc' || 'i-01d6737449bc52460' }}
            BACKUP_BUCKET: yunqiao-vendure-prod-backup-098208446664-apne1
            TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        steps:
            - name: Check out the locked source
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.sha }}
                  persist-credentials: false

            - name: Configure short-lived AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ env.AWS_ROLE_ARN }}
                  role-session-name: vendure-file-restore-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

            - name: Verify, restore if needed, and install the exact proof through Systems Manager
              id: verify
              run: |
                  set -Eeuo pipefail
                  ssm_command() {
                      local command_id status
                      command_id="$(aws ssm send-command \
                        --document-name AWS-RunShellScript --instance-ids "$INSTANCE_ID" \
                        --comment "Offsite file restore $TARGET_SHA" \
                        --parameters "$(jq -cn --arg command "$1" '{commands:[$command],executionTimeout:["300"]}')" \
                        --query 'Command.CommandId' --output text)"
                      [[ "$command_id" =~ ^[a-f0-9-]{36}$ ]]
                      for attempt in $(seq 1 60); do
                          status="$(aws ssm get-command-invocation --command-id "$command_id" \
                            --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
                          case "$status" in
                              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
                          esac
                          sleep 5
                      done
                      aws ssm get-command-invocation --command-id "$command_id" \
                        --instance-id "$INSTANCE_ID" --output json |
                        jq -er 'select(.Status == "Success") | .StandardOutputContent'
                  }

                  ssm_command "$(cat <<'READ_PROOF'
                  set -eu
                  file=/var/lib/vendure-readiness/file-restore-drill.json
                  if [ -f "$file" ]; then
                      cat "$file"
                  else
                      printf '{}\n'
                  fi
                  READ_PROOF
                  )" > "$RUNNER_TEMP/prior-file-restore.json"

                  python3 -B deploy/offsite-file-restore-drill.py \
                    --bucket "$BACKUP_BUCKET" --prefix files/ \
                    --target-sha "$TARGET_SHA" --run-id "$GITHUB_RUN_ID" \
                    --receipt "$RUNNER_TEMP/file-restore-drill.json" \
                    --prior-receipt "$RUNNER_TEMP/prior-file-restore.json" \
                    --release-receipt "$RUNNER_TEMP/file-restore-verification.json"

                  if [ -s "$RUNNER_TEMP/file-restore-drill.json" ]; then
                      echo "downloaded=true" >> "$GITHUB_OUTPUT"
                  fi

                  verification="$(base64 -w0 "$RUNNER_TEMP/file-restore-verification.json")"
                  proof_name="$TARGET_SHA-$GITHUB_RUN_ID.json"
                  result="$(ssm_command "$(cat <<INSTALL_PROOF
                  /bin/bash <<'VENDURE_OFFSITE_PROOF'
                  set -Eeuo pipefail
                  readiness=/var/lib/vendure-readiness
                  install -d -o root -g root -m 0700 "\$readiness/file-restore-drill-runs"
                  receipt="\$(mktemp "\$readiness/file-restore-drill-runs/.verification.XXXXXX")"
                  full_receipt=
                  trap 'rm -f -- "\$receipt" "\$full_receipt"' EXIT
                  printf '%s' '$verification' | base64 -d > "\$receipt"
                  jq -e --arg sha '$TARGET_SHA' --arg run '$GITHUB_RUN_ID' '
                      .method == "offhost-file-restore-verification" and .targetSha == \$sha and .runId == \$run and
                      .restoreProof.source == "offsite" and .restoreProof.method == "offhost-full-restore" and
                      (.downloadedArchiveBytes == 0 or
                          (.downloadedArchiveBytes == .restoreProof.archiveIdentity.archiveBytes and
                              .restoreProof.targetSha == \$sha and .restoreProof.runId == \$run))
                  ' "\$receipt" >/dev/null
                  if jq -e '.downloadedArchiveBytes > 0' "\$receipt" >/dev/null; then
                      full_receipt="\$(mktemp "\$readiness/.file-restore-drill.XXXXXX")"
                      jq -c '.restoreProof' "\$receipt" > "\$full_receipt"
                      chmod 0644 "\$full_receipt"
                      mv -T -- "\$full_receipt" "\$readiness/file-restore-drill.json"
                  else
                      jq -e --slurpfile actual "\$readiness/file-restore-drill.json" '
                          \$actual == [.restoreProof]
                      ' "\$receipt" >/dev/null
                  fi
                  chmod 0644 "\$receipt"
                  mv -T -- "\$receipt" "\$readiness/file-restore-drill-runs/$proof_name"
                  printf 'OFFSITE_FILE_RESTORE_VERIFIED sha=%s run=%s\n' '$TARGET_SHA' '$GITHUB_RUN_ID'
                  VENDURE_OFFSITE_PROOF
                  INSTALL_PROOF
                  )")"
                  [[ "$result" == "OFFSITE_FILE_RESTORE_VERIFIED sha=$TARGET_SHA run=$GITHUB_RUN_ID" ]]
                  jq -r '"Verified " + .restoreProof.backupFile + " from restore run " + .restoreProof.runId
                    + ", downloaded archive bytes: " + (.downloadedArchiveBytes | tostring)' \
                    "$RUNNER_TEMP/file-restore-verification.json" >> "$GITHUB_STEP_SUMMARY"

            - name: Preserve the new full-restore receipt
              if: ${{ !cancelled() && steps.verify.outputs.downloaded == 'true' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: offsite-file-restore-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/file-restore-drill.json
                  if-no-files-found: error
                  retention-days: 30

            - name: Preserve release verification
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: offsite-file-restore-verification-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/file-restore-verification.json
                  if-no-files-found: error
                  retention-days: 30
