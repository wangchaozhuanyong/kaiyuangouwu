name: Build & Test
on:
    workflow_dispatch:
        inputs:
            base_sha:
                description: 'Optional comparison base; defaults to the preceding commit'
                type: string
                default: ''
            target_sha:
                description: 'Optional revision to check'
                type: string
                default: ''
            full:
                description: 'Explicitly run the complete repository checks'
                type: boolean
                default: false
    workflow_call:
        inputs:
            base_sha:
                required: true
                type: string
            target_sha:
                required: true
                type: string
            full:
                type: boolean
                default: false
    pull_request:
        branches:
            - main

env:
    CI: true

concurrency:
    group: ci-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

# Keep the Redis service definition consistent across the e2e-* jobs.
# When updating the service (version bumps, env changes, health checks), update ALL four copies:
# e2e-sqljs, e2e-mariadb, e2e-mysql, e2e-postgres.
jobs:
    quality-gates:
        name: repository quality gates
        needs: detect-changes
        if: needs.detect-changes.outputs.has_quality == 'true' || inputs.full
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
            - uses: ./.github/actions/setup
            - name: Check migration registry
              if: needs.detect-changes.outputs.migration == 'true'
              run: bun run check:migration-registry
            - name: Check architecture budgets
              if: needs.detect-changes.outputs.architecture == 'true'
              run: bun run check:architecture-debt
            - name: Check managed publishing policy
              if: needs.detect-changes.outputs.publishing == 'true'
              run: bun run check:storefront-publishing
            - name: Check CI and release controls
              if: needs.detect-changes.outputs.controls == 'true'
              run: |
                  bun run test:repository-checks
                  node --test packages/dev-server/scripts/deployment-security.spec.mjs \
                      packages/dev-server/scripts/production-runtime-artifact.spec.mjs \
                      packages/dev-server/scripts/production-runtime-audit.spec.mjs \
                      packages/dev-server/scripts/production-operations.spec.mjs \
                      packages/dev-server/scripts/production-release-impact.spec.mjs \
                      packages/dev-server/scripts/production-release-smoke.spec.mjs \
                      packages/dev-server/scripts/production-release-retention.spec.mjs
                  node --test scripts/ci-impact.spec.mjs scripts/release-evidence.spec.mjs deploy/frontend-release.spec.mjs deploy/release-recovery.spec.mjs
            - name: Build lint prerequisites
              if: needs.detect-changes.outputs.has_lint_packages == 'true'
              run: bun run build:core-common
            - name: Lint changed source without new warnings
              env:
                  CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
                  BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
              run: |
                  base="$BASE_SHA"
                  if [ -z "$base" ]; then base="HEAD^"; fi
                  base="$(git merge-base "$base" HEAD)"
                  git diff --check "$base" HEAD
                  bun run lint:check -- --base "$base"
    detect-changes:
        name: detect changes
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            plan: ${{ steps.check.outputs.plan }}
            has_packages: ${{ steps.check.outputs.has_packages }}
            has_frontends: ${{ steps.check.outputs.has_frontends }}
            has_quality: ${{ steps.check.outputs.has_quality }}
            has_lint_packages: ${{ steps.check.outputs.has_lint_packages }}
            frontends: ${{ steps.check.outputs.frontends }}
            packages: ${{ steps.check.outputs.packages }}
            full: ${{ steps.check.outputs.full }}
            dependencies: ${{ steps.check.outputs.dependencies }}
            codegen: ${{ steps.check.outputs.codegen }}
            e2e_mysql: ${{ steps.check.outputs.e2e_mysql }}
            e2e_sqljs: ${{ steps.check.outputs.e2e_sqljs }}
            e2e_postgres: ${{ steps.check.outputs.e2e_postgres }}
            e2e_mariadb: ${{ steps.check.outputs.e2e_mariadb }}
            dashboard: ${{ steps.check.outputs.dashboard }}
            icloud: ${{ steps.check.outputs.icloud }}
            translation: ${{ steps.check.outputs.translation }}
            storefrontIntegration: ${{ steps.check.outputs.storefrontIntegration }}
            controls: ${{ steps.check.outputs.controls }}
            migration: ${{ steps.check.outputs.migration }}
            publishing: ${{ steps.check.outputs.publishing }}
            architecture: ${{ steps.check.outputs.architecture }}
            lane: ${{ steps.check.outputs.lane }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
                  fetch-depth: 0
            - name: Explain the affected checks
              id: check
              env:
                  BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || 'HEAD^' }}
                  FULL: ${{ inputs.full || false }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  base="$(git merge-base "$BASE_SHA" HEAD)"
                  node scripts/release-evidence.mjs plan "$base" HEAD "$FULL"
    dependency-audit:
        name: dependency audit
        needs: detect-changes
        if: needs.detect-changes.outputs.dependencies == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Audit dependencies at the production threshold
              run: node packages/dev-server/scripts/production-runtime-audit.mjs --audit-level high
    codegen:
        needs: detect-changes
        if: needs.detect-changes.outputs.codegen == 'true'
        uses: ./.github/workflows/codegen.yml
        with:
            target_sha: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
    build:
        name: build affected packages
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
        needs: detect-changes
        if: needs.detect-changes.outputs.has_packages == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Build affected packages and preserve compiled output
              env:
                  NODE_ENV: production
                  TZ: Asia/Shanghai
                  VENDURE_SERVE_GRAPHIQL: 'false'
                  VENDURE_DASHBOARD_URL: https://admin.build.test/dashboard
                  VENDURE_STOREFRONT_URL: https://store.build.test
                  VENDURE_EMAIL_FROM: Build Check <build@build.test>
                  VENDURE_IMPORT_ASSETS_DIR: /tmp/vendure-build-import
                  VENDURE_ASSET_UPLOAD_DIR: /tmp/vendure-build-assets
                  DIGITAL_DELIVERY_ROOT: /tmp/vendure-build-digital
                  DIGITAL_DELIVERY_SIGNING_SECRET: build-check-digital-secret-000000000000000000000000
                  IMAGE_GENERATION_STORAGE_ROOT: /tmp/vendure-build-images
                  CUSTOMER_IMAGE_PROCESSOR_SOCKET: /tmp/vendure-build-processor.sock
                  CUSTOMER_AVATAR_STORAGE_ROOT: /tmp/vendure-build-avatars
                  IMAGE_GENERATION_DOWNLOAD_SECRET: build-check-image-download-key-000000000000000000000000
                  IMAGE_GENERATION_MASTER_KEY: build-check-image-master-key-000000000000000000000000
                  VENDURE_GOOGLE_TRANSLATION_API_KEY: build-check-google-translation-api-key
                  STORE_DOMAIN_CNAME_TARGET: stores.build.test
                  STORE_DOMAIN_ROUTING_MODE: require-domain
                  STORE_DOMAIN_BYPASS_HOSTS: ''
                  SMTP_USER: build-check
                  SMTP_PASSWORD: build-check-password
                  SMTP_HOST: smtp.build.test
                  SMTP_PORT: '587'
                  SMTP_SECURE: 'false'
                  SUPERADMIN_USERNAME: build-check-admin
                  SUPERADMIN_PASSWORD: build-check-admin-password
                  COOKIE_SECRET: build-check-cookie-secret-000000000000000000000000
                  TWO_FACTOR_DASHBOARD_ENCRYPTION_KEY: build-check-dashboard-2fa-key-000000000000000000000000
                  ORDER_CONFIRMATION_TOKEN_SECRET: build-check-order-token-secret-000000000000000000000000
                  USDT_PAYMENT_PROOF_SECRET: build-check-usdt-proof-secret-000000000000000000000000
                  USDT_WALLET_ENCRYPTION_KEY: build-check-usdt-wallet-key-000000000000000000000000
                  USDT_REFUND_SENDER_ADDRESSES: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
                  STOREFRONT_PROMOTION_GATE_ENABLED: 'false'
                  STOREFRONT_ENTRY_SECRET: build-check-entry-secret-000000000000000000000000
                  DB: postgres
                  DB_USERNAME: build-check
                  DB_PASSWORD: build-check-password
                  DB_NAME: build-check
                  DB_SYNCHRONIZE: 'false'
              run: |
                  node scripts/ci-run.mjs build
                  node deploy/build-artifact.mjs pack "$RUNNER_TEMP/compiled-artifact"
            - name: Name compiled artifact
              id: compiled
              run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: compiled-${{ steps.compiled.outputs.tree }}
                  path: ${{ runner.temp }}/compiled-artifact
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 7
    unit-tests:
        name: affected unit tests
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
        needs: [detect-changes, build]
        if: needs.detect-changes.outputs.has_packages == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read
        strategy:
            fail-fast: false
            matrix:
                node: ${{ inputs.full && fromJSON('["20.x", "22.x", "24.x"]') || fromJSON('["22.x"]') }}
        services:
            icloud-mysql:
                image: ${{ needs.detect-changes.outputs.icloud == 'true' && 'mysql:8.4' || '' }}
                env:
                    MYSQL_ROOT_PASSWORD: password
                ports:
                    - 33552:3306
                options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10
            translation-postgres:
                image: ${{ needs.detect-changes.outputs.translation == 'true' && 'postgres:16' || '' }}
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_DB: translation_outbox_e2e
                    # Disposable runner service; tests are hard-bound to loopback and this database.
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports:
                    - 15492:5432
                options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node }}
            - name: Restore this run's compiled output
              id: compiled
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node deploy/build-artifact.mjs restore-tests "$RUNNER_TEMP/compiled-input" "$GITHUB_RUN_ID"
            - name: Build missing test prerequisites
              if: steps.compiled.outputs.restored != 'true'
              run: node scripts/ci-run.mjs prepare-tests
            - name: Build local application plugins
              if: needs.detect-changes.outputs.full == 'true' && steps.compiled.outputs.restored != 'true'
              run: bun run --cwd packages/dev-server build:local-plugins
            - name: Unit tests
              run: node scripts/ci-run.mjs test
            - name: Validate affected database migrations
              if: needs.detect-changes.outputs.migration == 'true'
              run: bun run --cwd packages/dev-server test:migrations
            - name: iCloud plugin and dashboard extension types
              if: needs.detect-changes.outputs.icloud == 'true'
              working-directory: packages/icloud-relay-plugin
              run: bun run check-types
            - name: iCloud admin HTTP and SQL.js regression
              if: needs.detect-changes.outputs.icloud == 'true'
              working-directory: packages/icloud-relay-plugin
              env:
                  DB: sqljs
              run: bun run test:integration
            - name: iCloud admin MySQL concurrency regression
              if: needs.detect-changes.outputs.icloud == 'true'
              working-directory: packages/icloud-relay-plugin
              env:
                  DB: mysql
                  E2E_MYSQL_PORT: '33552'
              run: bun run test:integration
            - name: Translation outbox PostgreSQL retry and process recovery
              if: needs.detect-changes.outputs.translation == 'true'
              working-directory: packages/content-translation-plugin
              env:
                  TRANSLATION_TEST_POSTGRES: '1'
              run: bunx vitest run src/content-translation-retry.service.spec.ts src/provider-process.spec.ts
            - name: Translation outbox PostgreSQL migration
              if: needs.detect-changes.outputs.translation == 'true'
              working-directory: packages/dev-server
              env:
                  TRANSLATION_TEST_POSTGRES: '1'
              run: bunx vitest run migrations/translation-outbox.spec.ts
            - name: Translation outbox Admin and Shop API acceptance
              if: needs.detect-changes.outputs.translation == 'true'
              env:
                  PACKAGE: storefront-content-plugin
                  VENDURE_DISABLE_TELEMETRY: 'true'
              run: bunx vitest run --config e2e-common/vitest.config.mts packages/storefront-content-plugin/e2e/translation-outbox.e2e-spec.ts
            - name: Catalog import translation outbox acceptance
              if: needs.detect-changes.outputs.translation == 'true'
              env:
                  PACKAGE: content-translation-plugin
                  VENDURE_DISABLE_TELEMETRY: 'true'
              run: bunx vitest run --config e2e-common/vitest.config.mts packages/content-translation-plugin/e2e/catalog-import-rate-limit.e2e-spec.ts --maxWorkers=1
            - name: Operations dashboard regression tests
              if: needs.detect-changes.outputs.full == 'true' || contains(fromJSON(needs.detect-changes.outputs.packages), 'operations-dashboard-plugin')
              run: bun run --cwd packages/operations-dashboard-plugin test
            - name: Install browser for storefront configuration acceptance
              if: needs.detect-changes.outputs.storefrontIntegration == 'true'
              run: bunx playwright install --with-deps chromium
            - name: Verify saved configuration across stores and real homepage
              if: needs.detect-changes.outputs.storefrontIntegration == 'true'
              env:
                  PACKAGE: storefront-content-plugin
                  VENDURE_DISABLE_TELEMETRY: 'true'
                  STOREFRONT_TEST_OUTPUT: ${{ runner.temp }}/storefront-unification
              run: bunx vitest run --config e2e-common/vitest.config.mts packages/storefront-content-plugin/e2e/storefront-unification.e2e-spec.ts
    dashboard-i18n:
        name: dashboard i18n sync
        needs: detect-changes
        if: needs.detect-changes.outputs.dashboard == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Check i18n catalogs are in sync
              working-directory: packages/dashboard
              run: bash scripts/check-i18n-sync.sh
            - name: Check bilingual source and catalog quality
              working-directory: packages/dashboard
              run: bun run i18n:check-all
    dashboard-storybook:
        name: dashboard Storybook quality gate
        needs: detect-changes
        if: needs.detect-changes.outputs.dashboard == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Build core and common packages
              run: bun run build:core-common
            - name: Dashboard lint
              working-directory: packages/dashboard
              run: bun run lint
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              working-directory: packages/dashboard
              run: bunx playwright install chromium chromium-headless-shell
            - name: Install Playwright system deps
              working-directory: packages/dashboard
              run: bunx playwright install-deps chromium
            - name: Storybook browser and accessibility tests
              working-directory: packages/dashboard
              run: bun run test:storybook:ci
            - name: Build Storybook and check bundle budgets
              working-directory: packages/dashboard
              run: bun run storybook:build
    dashboard-storybook-windows:
        name: dashboard Storybook Windows Chrome gate
        needs: detect-changes
        if: needs.detect-changes.outputs.dashboard == 'true' && inputs.full
        runs-on: windows-latest
        timeout-minutes: 25
        permissions:
            contents: read
        env:
            STORYBOOK_BROWSER_CHANNEL: chrome
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Build core and common packages
              run: bun run build:core-common
            - name: Storybook browser and accessibility tests in Chrome
              working-directory: packages/dashboard
              run: bun run test:storybook:ci
    dashboard-e2e:
        name: dashboard e2e (${{ matrix.shard }})
        needs: detect-changes
        if: needs.detect-changes.outputs.dashboard == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Build
              run: bunx lerna run ci --scope @vendure/testing --include-dependencies
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  # The key version prefix (v2) lets us evict caches poisoned by an
                  # earlier incomplete browser install. No restore-keys: a prefix
                  # fallback would drag stale browser binaries forward on a Playwright
                  # version bump, and an exact hit on that poisoned cache then skips
                  # the install step indefinitely.
                  key: playwright-v2-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              # chromium-headless-shell is a separate download since Playwright 1.49
              # and is what headless CI runs actually launch.
              run: bunx playwright install chromium chromium-headless-shell
              working-directory: packages/dashboard
            - name: Install Playwright system deps
              run: bunx playwright install-deps chromium
              working-directory: packages/dashboard
            - name: Dashboard e2e tests
              run: bun run e2e:pw -- --shard=${{ matrix.shard }}/4
              working-directory: packages/dashboard
    e2e-sqljs:
        name: e2e (sqljs)
        needs: [detect-changes, build]
        if: needs.detect-changes.outputs.e2e_sqljs == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
        services:
            redis:
                image: redis:7.4.1
                ports:
                    - 6379
        strategy:
            fail-fast: false
            matrix:
                node: ${{ inputs.full && fromJSON('["20.x", "22.x", "24.x"]') || fromJSON('["22.x"]') }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node }}
            - name: Restore compiled test prerequisites
              id: compiled
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node deploy/build-artifact.mjs restore-tests "$RUNNER_TEMP/compiled-input" "$GITHUB_RUN_ID"
            - name: Build missing prerequisites
              if: steps.compiled.outputs.restored != 'true'
              run: node scripts/ci-run.mjs prepare-tests
            - name: e2e tests
              env:
                  E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
                  DB: sqljs
              run: node scripts/ci-run.mjs e2e
    e2e-mariadb:
        name: e2e (mariadb)
        needs: [detect-changes, build]
        if: needs.detect-changes.outputs.e2e_mariadb == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
        services:
            mariadb:
                # With v11.6.2+, a default was changed, (https://mariadb.com/kb/en/innodb-system-variables/#innodb_snapshot_isolation)
                # which causes e2e test failures currently
                image: mariadb:11.5
                env:
                    MARIADB_ROOT_PASSWORD: password
                ports:
                    - 3306
                options: --health-cmd="mariadb-admin ping -h localhost -u vendure -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3
            redis:
                image: redis:7.4.1
                ports:
                    - 6379
        strategy:
            fail-fast: false
            matrix:
                node: ${{ inputs.full && fromJSON('["20.x", "22.x", "24.x"]') || fromJSON('["22.x"]') }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node }}
            - name: Restore compiled test prerequisites
              id: compiled
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node deploy/build-artifact.mjs restore-tests "$RUNNER_TEMP/compiled-input" "$GITHUB_RUN_ID"
            - name: Build missing prerequisites
              if: steps.compiled.outputs.restored != 'true'
              run: node scripts/ci-run.mjs prepare-tests
            - name: e2e tests
              env:
                  E2E_MARIADB_PORT: ${{ job.services.mariadb.ports['3306'] }}
                  E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
                  DB: mariadb
              run: node scripts/ci-run.mjs e2e
    e2e-mysql:
        name: e2e (mysql)
        needs: [detect-changes, build]
        if: needs.detect-changes.outputs.e2e_mysql == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
            actions: read
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
        services:
            mysql:
                image: vendure/mysql-8-native-auth:latest
                env:
                    MYSQL_ROOT_PASSWORD: password
                ports:
                    - 3306
                options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=20s --health-retries=10
            redis:
                image: redis:7.4.1
                ports:
                    - 6379
        strategy:
            fail-fast: false
            matrix:
                node: ${{ inputs.full && fromJSON('["20.x", "22.x", "24.x"]') || fromJSON('["22.x"]') }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node }}
            - name: Restore compiled test prerequisites
              id: compiled
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node deploy/build-artifact.mjs restore-tests "$RUNNER_TEMP/compiled-input" "$GITHUB_RUN_ID"
            - name: Build missing prerequisites
              if: steps.compiled.outputs.restored != 'true'
              run: node scripts/ci-run.mjs prepare-tests
            - name: e2e tests
              env:
                  E2E_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
                  E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
                  DB: mysql
              run: node scripts/ci-run.mjs e2e
    e2e-postgres:
        name: e2e (postgres)
        needs: [detect-changes, build]
        if: needs.detect-changes.outputs.e2e_postgres == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            actions: read
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: vendure
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432
                options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
            redis:
                image: redis:7.4.1
                ports:
                    - 6379
        strategy:
            fail-fast: false
            matrix:
                node: ${{ inputs.full && fromJSON('["20.x", "22.x", "24.x"]') || fromJSON('["22.x"]') }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node }}
            - name: Restore compiled test prerequisites
              id: compiled
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node deploy/build-artifact.mjs restore-tests "$RUNNER_TEMP/compiled-input" "$GITHUB_RUN_ID"
            - name: Build missing prerequisites
              if: steps.compiled.outputs.restored != 'true'
              run: node scripts/ci-run.mjs prepare-tests
            - name: e2e tests
              env:
                  E2E_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
                  E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
                  DB: postgres
              run: node scripts/ci-run.mjs e2e
    frontend:
        name: frontend (${{ matrix.component }})
        needs: detect-changes
        if: needs.detect-changes.outputs.has_frontends == 'true' && needs.detect-changes.outputs.full != 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                component: ${{ fromJSON(needs.detect-changes.outputs.frontends) }}
        env:
            CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
            COMPONENT: ${{ matrix.component }}
        steps:
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - uses: ./.github/actions/setup
            - name: Check and build the affected frontend
              env:
                  NODE_ENV: production
              run: |
                  CI_PLAN="$(node -p 'const plan = JSON.parse(process.env.CI_PLAN); JSON.stringify({...plan, full: plan.full || plan.frontendFull})')" \
                    node scripts/ci-run.mjs frontend "$COMPONENT"
            - name: Package reusable frontend
              env:
                  NODE_ENV: production
              id: artifact
              run: node deploy/frontend-artifact.mjs pack "$COMPONENT" "$RUNNER_TEMP/frontend-artifact"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: ${{ steps.artifact.outputs.name }}
                  path: ${{ runner.temp }}/frontend-artifact
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 7
    all-passed:
        name: all-passed
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        if: always()
        needs:
            - frontend
            - quality-gates
            - detect-changes
            - dependency-audit
            - codegen
            - build
            - unit-tests
            - dashboard-i18n
            - dashboard-storybook
            - dashboard-storybook-windows
            - dashboard-e2e
            - e2e-sqljs
            - e2e-mariadb
            - e2e-mysql
            - e2e-postgres
        steps:
            - run: exit ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 1 || 0 }}
            - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
              with:
                  ref: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
            - name: Record exact checked source and scope
              env:
                  CI_JOB_RESULTS: ${{ toJSON(needs) }}
                  CI_PLAN: ${{ needs.detect-changes.outputs.plan }}
              run: node scripts/release-evidence.mjs write
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ci-evidence.json
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 14
