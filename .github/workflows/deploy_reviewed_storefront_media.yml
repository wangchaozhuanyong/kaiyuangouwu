name: Deploy Reviewed Storefront Media

on:
    workflow_dispatch:
        inputs:
            target_sha:
                description: 'Full 40-character SHA currently at origin/main'
                required: true
                type: string
            source_run_id:
                description: 'Successful Production Runtime Artifact workflow run ID'
                required: true
                type: string
            media_keys:
                description: 'Reviewed comma-separated storefront media manifest keys'
                required: true
                type: string
            channel_codes:
                description: 'Reviewed comma-separated Vendure Channel codes'
                required: true
                type: string

permissions:
    actions: read
    contents: read
    id-token: write

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: deploy reviewed storefront media through AWS SSM
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            AWS_REGION: ap-northeast-1
            AWS_ACCOUNT_ID: '079740175286'
            AWS_ROLE_ARN: arn:aws:iam::079740175286:role/yunqiao-vendure-github-deploy
            INSTANCE_ID: i-041a146558e432cbf
            ARTIFACT_BUCKET: yunqiao-vendure-prod-backup-079740175286-apne1
            TARGET_SHA: ${{ inputs.target_sha }}
            SOURCE_RUN_ID: ${{ inputs.source_run_id }}
            MEDIA_KEYS: ${{ inputs.media_keys }}
            CHANNEL_CODES: ${{ inputs.channel_codes }}

        steps:
            - name: Validate reviewed release identity
              run: |
                  [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
                  [[ "$MEDIA_KEYS" =~ ^[a-z0-9][a-z0-9-]*(,[a-z0-9][a-z0-9-]*)*$ ]]
                  [[ "$CHANNEL_CODES" =~ ^[a-z0-9_][a-z0-9_-]*(,[a-z0-9_][a-z0-9_-]*)*$ ]]

            - name: Checkout target commit
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                  ref: ${{ inputs.target_sha }}
                  fetch-depth: 0

            - name: Enforce main release source
              run: |
                  test "$(git rev-parse HEAD^{commit})" = "$TARGET_SHA"
                  git fetch origin main --no-tags --prune
                  test "$(git rev-parse refs/remotes/origin/main^{commit})" = "$TARGET_SHA"
                  test -z "$(git status --porcelain)"

            - name: Download verified runtime artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: production-runtime-${{ inputs.target_sha }}
                  path: artifacts
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  run-id: ${{ inputs.source_run_id }}

            - name: Validate downloaded archive
              run: |
                  shopt -s nullglob
                  archives=(artifacts/*.tar.gz)
                  checksums=(artifacts/*.tar.gz.sha256)
                  test "${#archives[@]}" -eq 1
                  test "${#checksums[@]}" -eq 1

                  ARCHIVE_PATH="${archives[0]}"
                  ARCHIVE_NAME="$(basename "$ARCHIVE_PATH")"
                  ARTIFACT_NAME="${ARCHIVE_NAME%.tar.gz}"
                  CHECKSUM_PATH="${checksums[0]}"

                  [[ "$ARTIFACT_NAME" =~ ^${TARGET_SHA}-[0-9]+-[0-9]+-linux-x64$ ]]
                  test "$(basename "$CHECKSUM_PATH")" = "${ARCHIVE_NAME}.sha256"
                  (
                    cd artifacts
                    sha256sum --check "$(basename "$CHECKSUM_PATH")"
                  )

                  echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
                  echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"
                  echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
                  echo "CHECKSUM_PATH=$CHECKSUM_PATH" >> "$GITHUB_ENV"
                  echo "ARTIFACT_S3_PREFIX=s3://${ARTIFACT_BUCKET}/deployments/${TARGET_SHA}" >> "$GITHUB_ENV"

            - name: Configure short-lived AWS credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: ${{ env.AWS_ROLE_ARN }}
                  role-session-name: vendure-reviewed-media-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
                  allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

            - name: Upload immutable runtime to private S3
              run: |
                  aws s3 cp "$ARCHIVE_PATH" "$ARTIFACT_S3_PREFIX/$ARCHIVE_NAME" --only-show-errors
                  aws s3 cp "$CHECKSUM_PATH" "$ARTIFACT_S3_PREFIX/$ARCHIVE_NAME.sha256" --only-show-errors

            - name: Deploy reviewed media through Systems Manager
              run: |
                  REMOTE_COMMAND="sudo -H -u ubuntu env GITHUB_RUN_ID='${GITHUB_RUN_ID}' VENDURE_REVIEWED_STOREFRONT_MEDIA_KEYS='${MEDIA_KEYS}' VENDURE_REVIEWED_STOREFRONT_MEDIA_CHANNEL_CODES='${CHANNEL_CODES}' /bin/bash -c 'set -Eeuo pipefail; cd /var/www/kaiyuangouwu; git fetch origin main --no-tags --prune; test -z \"\$(git status --porcelain --untracked-files=no)\"; git cat-file -e \"${TARGET_SHA}^{commit}\"; git merge-base --is-ancestor HEAD \"${TARGET_SHA}\"; git merge --ff-only \"${TARGET_SHA}\"; test \"\$(git rev-parse HEAD^{commit})\" = \"${TARGET_SHA}\"; exec ./deploy/deploy-production-from-s3.sh \"${TARGET_SHA}\" \"${ARTIFACT_NAME}\" \"${ARTIFACT_S3_PREFIX}\"'"
                  jq -n --arg command "$REMOTE_COMMAND" \
                    '{commands: [$command], executionTimeout: ["3600"]}' > "$RUNNER_TEMP/ssm-parameters.json"

                  COMMAND_ID="$(aws ssm send-command \
                    --region "$AWS_REGION" \
                    --document-name AWS-RunShellScript \
                    --instance-ids "$INSTANCE_ID" \
                    --comment "Reviewed Vendure storefront media deploy ${TARGET_SHA}" \
                    --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
                    --timeout-seconds 600 \
                    --query 'Command.CommandId' \
                    --output text)"
                  test -n "$COMMAND_ID"

                  status=Pending
                  for attempt in $(seq 1 360); do
                    status="$(aws ssm get-command-invocation \
                      --region "$AWS_REGION" \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$INSTANCE_ID" \
                      --query Status \
                      --output text 2>/dev/null || true)"
                    case "$status" in
                      Success|Failed|Cancelled|TimedOut|Cancelling)
                        break
                        ;;
                    esac
                    sleep 5
                  done

                  aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                    --output json
                  test "$status" = Success

                  {
                    echo "## Reviewed storefront media deployment"
                    echo
                    echo "- Target SHA: \`$TARGET_SHA\`"
                    echo "- Artifact: \`$ARTIFACT_NAME\`"
                    echo "- Media keys: \`$MEDIA_KEYS\`"
                    echo "- Channel codes: \`$CHANNEL_CODES\`"
                    echo "- SSM command: \`$COMMAND_ID\`"
                    echo "- Status: \`$status\`"
                  } >> "$GITHUB_STEP_SUMMARY"
